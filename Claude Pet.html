document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"864f464d-a9fe-4bc2-8e3a-95ab4931f262\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<script src=\"dcd0ac5a-d2f5-4d7a-82a5-739d46f90fc7\"><\u002Fscript>\n<script src=\"4ea75f0a-f443-4875-81fd-16fe21fd2078\"><\u002Fscript>\n<script src=\"a2532384-4e7d-453b-82fb-d1c254332a70\"><\u002Fscript>\n<script src=\"cc513f4c-6497-4521-8193-7c0465b0c9bb\"><\u002Fscript>\n<script src=\"7d13b7c7-5061-4eb4-8bfb-09ffe5d2d286\"><\u002Fscript>\n<script src=\"67ed290e-7ec7-4bb5-a1c3-21cc55f2a888\"><\u002Fscript>\n<script src=\"a77c8180-d0b0-4a3d-b870-fbbf0c894293\"><\u002Fscript>\n<script src=\"e053f27d-35ea-4cad-a0ba-1eb02c33701f\"><\u002Fscript>\n<style>\n  body { margin: 0; background: #0C0C0F; }\n  a { color: #FF7A5C; text-decoration: none; }\n  a:hover { color: #FFD23F; }\n<\u002Fstyle>\n<\u002Fhelmet>\n<section style=\"padding:56px 64px 48px; font-family:'JetBrains Mono', ui-monospace, monospace; color:#EAEAEA;\">\n  <div id=\"4a\" style=\"display:flex; align-items:baseline; gap:16px; margin-bottom:10px;\">\n    <div style=\"font-size:12px; font-weight:700; letter-spacing:0.1em; color:#06161A; background:#00E5FF; padding:4px 8px;\">4a<\u002Fdiv>\n    <div style=\"font-size:22px; font-weight:700; letter-spacing:0.06em;\">FIVE SLEEPS, FIVE NAPS<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:13px; line-height:1.75; color:#8A8A94; max-width:820px; margin-bottom:32px;\">\n    Sleeps are for the night and run slow. Naps are shorter, lighter, and three of them end with the pet catching itself awake. Every Z is drawn inside the same 200×200 cell, so each is a self-contained sprite with no separate overlay to place.\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap:34px; margin-bottom:76px;\">\n    <sc-for list=\"{{ rest }}\" as=\"r\" hint-placeholder-count=\"10\">\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <div style=\"display:flex; align-items:baseline; gap:12px;\">\n          <div style=\"font-size:10px; letter-spacing:0.14em; color:{{ r.tagColor }}; border:1px solid {{ r.tagColor }}; padding:3px 6px;\">{{ r.group }}<\u002Fdiv>\n          <div style=\"font-size:15px; font-weight:700; letter-spacing:0.12em;\">{{ r.name }}<\u002Fdiv>\n          <div style=\"font-size:11px; color:#5A5A63; letter-spacing:0.08em;\">{{ r.spec }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap;\">\n          <div style=\"background:#000; padding:14px; border:1px solid #23232A;\">\n            <canvas ref=\"{{ r.screenRef }}\" width=\"368\" height=\"448\" style=\"display:block; width:368px; height:448px; image-rendering:pixelated;\"><\u002Fcanvas>\n          <\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; gap:12px; max-width:520px;\">\n            <div style=\"display:flex; gap:2px; background:#000; padding:2px; border:1px solid #23232A; width:fit-content;\">\n              <sc-for list=\"{{ r.frames }}\" as=\"f\" hint-placeholder-count=\"4\">\n                <div>\n                  <canvas ref=\"{{ f.ref }}\" width=\"200\" height=\"200\" style=\"display:block; width:200px; height:200px; image-rendering:pixelated;\"><\u002Fcanvas>\n                  <div style=\"font-size:10px; letter-spacing:0.06em; color:#4A4A52; padding:4px 2px 2px; text-align:center;\">{{ f.n }}<\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"font-size:12px; line-height:1.7; color:#8A8A94;\">{{ r.note }}<\u002Fdiv>\n            <div style=\"font-size:11px; color:#4A4A52; letter-spacing:0.06em;\">{{ r.file }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div id=\"3a\" style=\"display:flex; align-items:baseline; gap:16px; margin-bottom:10px;\">\n    <div style=\"font-size:12px; font-weight:700; letter-spacing:0.1em; color:#06161A; background:#00E5FF; padding:4px 8px;\">3a<\u002Fdiv>\n    <div style=\"font-size:22px; font-weight:700; letter-spacing:0.06em;\">TWELVE MONTHS, SEVEN SINGLE DAYS<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:13px; line-height:1.75; color:#8A8A94; max-width:820px; margin-bottom:14px;\">\n    Background only — the scene changes, the pet is untouched, so every holiday works with all seven characters and every state. Eight frames each, drawn behind the pet on the same 368×448 field, each on its own small ramp so no pet palette grows.\n  <\u002Fdiv>\n  <div style=\"font-size:12px; line-height:1.8; color:#5A5A63; max-width:820px; margin-bottom:32px;\">\n    The device picks its own: whichever holiday owns the current month. Today that is <span style=\"color:#00E5FF;\">{{ todayHoliday }}<\u002Fspan>.\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-wrap:wrap; gap:32px; margin-bottom:32px;\">\n    <sc-for list=\"{{ holidays }}\" as=\"h\" hint-placeholder-count=\"12\">\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <div style=\"background:#000; padding:14px; border:1px solid {{ h.border }};\">\n          <canvas ref=\"{{ h.ref }}\" width=\"368\" height=\"448\" style=\"display:block; width:368px; height:448px; image-rendering:pixelated;\"><\u002Fcanvas>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:10px;\">\n          <div style=\"font-size:11px; letter-spacing:0.14em; color:#5A5A63; width:34px;\">{{ h.month }}<\u002Fdiv>\n          <div style=\"font-size:14px; font-weight:700; letter-spacing:0.12em;\">{{ h.name }}<\u002Fdiv>\n          <div style=\"font-size:11px; color:#5A5A63; letter-spacing:0.08em;\">{{ h.when }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.7; color:#8A8A94; max-width:392px;\">{{ h.note }}<\u002Fdiv>\n        <div style=\"display:flex; gap:4px; flex-wrap:wrap;\">\n          <sc-for list=\"{{ h.palette }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div title=\"{{ p.role }}\" style=\"width:16px; height:16px; background:{{ p.hex }}; border:1px solid #23232A;\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"font-size:12px; line-height:1.75; color:#8A8A94; max-width:820px; margin-bottom:52px;\">\n    Ships as <span style=\"color:#EAEAEA;\">sprites/holidays/&lt;name&gt;/<\u002Fspan> — eight 368×448 frames, a horizontal sheet and the ramp swatch for each. The pet, its states and the growth ring all composite on top unchanged.\n  <\u002Fdiv>\n\n  <div style=\"display:flex; align-items:baseline; gap:16px; margin-bottom:10px;\">\n    <div style=\"font-size:12px; font-weight:700; letter-spacing:0.1em; color:#06161A; background:#00E5FF; padding:4px 8px;\">3b<\u002Fdiv>\n    <div style=\"font-size:22px; font-weight:700; letter-spacing:0.06em;\">SEVEN SINGLE DAYS<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:13px; line-height:1.75; color:#8A8A94; max-width:820px; margin-bottom:32px;\">\n    These outrank the month scene on their exact date and hand it back the next day. December alone runs four: the solstice on the 21st, Christmas Eve on the 24th, Christmas on the 25th, New Year's Eve on the 31st, and the month default on every other day.\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-wrap:wrap; gap:32px; margin-bottom:32px;\">\n    <sc-for list=\"{{ dayHolidays }}\" as=\"h\" hint-placeholder-count=\"7\">\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <div style=\"background:#000; padding:14px; border:1px solid {{ h.border }};\">\n          <canvas ref=\"{{ h.ref }}\" width=\"368\" height=\"448\" style=\"display:block; width:368px; height:448px; image-rendering:pixelated;\"><\u002Fcanvas>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:10px;\">\n          <div style=\"font-size:11px; letter-spacing:0.14em; color:#00E5FF;\">{{ h.when }}<\u002Fdiv>\n          <div style=\"font-size:14px; font-weight:700; letter-spacing:0.12em;\">{{ h.name }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.7; color:#8A8A94; max-width:392px;\">{{ h.note }}<\u002Fdiv>\n        <div style=\"display:flex; gap:4px; flex-wrap:wrap;\">\n          <sc-for list=\"{{ h.palette }}\" as=\"p\" hint-placeholder-count=\"5\">\n            <div title=\"{{ p.role }}\" style=\"width:16px; height:16px; background:{{ p.hex }}; border:1px solid #23232A;\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"font-size:12px; line-height:1.75; color:#8A8A94; max-width:820px; margin-bottom:76px;\">\n    Nineteen scenes in all. Resolution order is exact date first, then the month default — verified across the whole calendar, including the four December dates and the two that share June with Pride.\n  <\u002Fdiv>\n\n  <div id=\"2a\" style=\"display:flex; align-items:baseline; gap:16px; margin-bottom:10px;\">\n    <div style=\"font-size:12px; font-weight:700; letter-spacing:0.1em; color:#06161A; background:#00E5FF; padding:4px 8px;\">2a<\u002Fdiv>\n    <div style=\"font-size:22px; font-weight:700; letter-spacing:0.06em;\">GROWTH RING<\u002Fdiv>\n    <div style=\"font-size:11px; color:#5A5A63; letter-spacing:0.08em;\">the chosen growth system<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:13px; line-height:1.75; color:#8A8A94; max-width:820px; margin-bottom:34px;\">\n    The ring is its own transparent overlay — a 256×256 layer centred on the pet stage, composited over whatever the pet happens to be doing. Year progress fills clockwise from twelve o'clock; the four quarter arcs are split by a hard gap, a white nib marks the exact position, and each boundary pip lights as it is passed. The character art is untouched, so the ring works with every pet, every state, every hat.\n  <\u002Fdiv>\n  <div style=\"display:flex; gap:40px; flex-wrap:wrap; margin-bottom:56px;\">\n    <div>\n      <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin-bottom:14px;\">LIVE — DRAG THE YEAR<\u002Fdiv>\n      <div style=\"background:#000; padding:16px; border:1px solid #23232A; width:fit-content;\">\n        <canvas ref=\"{{ ringLiveRef }}\" width=\"368\" height=\"448\" style=\"display:block; width:368px; height:448px; image-rendering:pixelated;\"><\u002Fcanvas>\n      <\u002Fdiv>\n      <input type=\"range\" min=\"0\" max=\"100\" step=\"1\" value=\"{{ ringPct }}\" sc-camel-on-input=\"{{ onRingScrub }}\" style=\"width:368px; margin-top:16px; accent-color:#00E5FF;\">\n      <div style=\"display:flex; justify-content:space-between; font-size:11px; letter-spacing:0.1em; color:#5A5A63; margin-top:8px;\">\n        <div>Q1<\u002Fdiv><div>Q2<\u002Fdiv><div>Q3<\u002Fdiv><div>Q4<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"font-size:12px; letter-spacing:0.1em; color:#EAEAEA; margin-top:14px;\">{{ ringReadout }}<\u002Fdiv>\n      <div style=\"display:flex; gap:8px; margin-top:14px; flex-wrap:wrap;\">\n        <sc-for list=\"{{ ringJumps }}\" as=\"j\" hint-placeholder-count=\"5\">\n          <button sc-camel-on-click=\"{{ j.onClick }}\" style=\"font-family:inherit; font-size:11px; letter-spacing:0.12em; padding:9px 13px; background:#15151A; color:#EAEAEA; border:1px solid #2C2C34; cursor:pointer;\" style-hover=\"border-color:#00E5FF; color:#00E5FF;\">{{ j.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin-bottom:6px;\">QUARTER CLOSE — ONE-SHOT, 4 FRAMES @ 8 FPS<\u002Fdiv>\n      <div style=\"font-size:11px; letter-spacing:0.12em; color:#00E5FF; margin-bottom:14px;\">{{ ringStripCaption }}<\u002Fdiv>\n      <div style=\"display:flex; gap:2px; background:#000; padding:2px; border:1px solid #23232A; width:fit-content;\">\n        <sc-for list=\"{{ ringPulseFrames }}\" as=\"f\" hint-placeholder-count=\"4\">\n          <div>\n            <canvas ref=\"{{ f.ref }}\" width=\"256\" height=\"256\" style=\"display:block; width:256px; height:256px; image-rendering:pixelated;\"><\u002Fcanvas>\n            <div style=\"font-size:10px; letter-spacing:0.1em; color:#4A4A52; padding:6px 4px 4px;\">{{ f.file }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:12px; line-height:1.7; color:#8A8A94; max-width:520px; margin-top:14px;\">\n        Fires the moment a quarter closes: the whole ring flashes white, then yellow, then settles to cyan while the pip that was just passed pops with four spokes. Exported per quarter, so the correct pip pops each time.\n      <\u002Fdiv>\n      <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin:32px 0 14px;\">MILESTONES<\u002Fdiv>\n      <div style=\"display:flex; gap:8px; flex-wrap:wrap;\">\n        <sc-for list=\"{{ ringMilestones }}\" as=\"m\" hint-placeholder-count=\"5\">\n          <div style=\"background:#000; border:1px solid #23232A; padding:8px;\">\n            <canvas ref=\"{{ m.ref }}\" width=\"184\" height=\"224\" style=\"display:block; width:184px; height:224px; image-rendering:pixelated;\"><\u002Fcanvas>\n            <div style=\"font-size:10px; letter-spacing:0.12em; color:#5A5A63; padding-top:8px; text-align:center;\">{{ m.label }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin-bottom:14px;\">PROGRESS FRAMES — 21 STEPS, 5% APART, 256×256 TRANSPARENT<\u002Fdiv>\n  <div style=\"display:flex; gap:2px; background:#000; padding:2px; border:1px solid #23232A; width:fit-content; flex-wrap:wrap; max-width:1120px; margin-bottom:20px;\">\n    <sc-for list=\"{{ ringSteps }}\" as=\"s\" hint-placeholder-count=\"21\">\n      <div>\n        <canvas ref=\"{{ s.ref }}\" width=\"128\" height=\"128\" style=\"display:block; width:128px; height:128px; image-rendering:pixelated;\"><\u002Fcanvas>\n        <div style=\"font-size:10px; letter-spacing:0.06em; color:#4A4A52; padding:4px 2px 2px; text-align:center;\">{{ s.label }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"font-size:12px; line-height:1.75; color:#8A8A94; max-width:820px; margin-bottom:76px;\">\n    Shown here at half scale to fit the row; every file is 256×256 at 1:1. Firmware can also draw the ring procedurally from two colours and an angle if the flash frames are all it needs from the export. Ships as <span style=\"color:#EAEAEA;\">sprites/ring/<\u002Fspan> — 21 progress frames, 16 pulse frames, and a sheet for each.\n  <\u002Fdiv>\n\n  <div style=\"display:flex; align-items:baseline; gap:16px; margin-bottom:10px;\">\n    <div style=\"font-size:12px; letter-spacing:0.18em; color:#8A8A94; background:#1A1A20; padding:5px 9px;\">EARLIER<\u002Fdiv>\n    <div style=\"font-size:22px; font-weight:700; letter-spacing:0.06em;\">PICK YOUR PET<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:13px; line-height:1.75; color:#8A8A94; max-width:820px; margin-bottom:40px;\">\n    Five characters share one pose rig, so every state and every idle variation exists for each of them. The devices below run the same showreel in sync. Pick one and the whole page follows it — states, variations, frame breakdown, palette.\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-wrap:wrap; gap:28px; margin-bottom:64px;\">\n    <sc-for list=\"{{ chars }}\" as=\"c\" hint-placeholder-count=\"7\">\n      <div style=\"display:flex; flex-direction:column; gap:14px;\">\n        <div style=\"background:#000; padding:14px; border:2px solid {{ c.border }};\">\n          <canvas ref=\"{{ c.ref }}\" width=\"368\" height=\"448\" style=\"display:block; width:368px; height:448px; image-rendering:pixelated;\"><\u002Fcanvas>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ c.onSelect }}\" style=\"font-family:inherit; font-size:12px; letter-spacing:0.14em; padding:12px 16px; background:{{ c.btnBg }}; color:{{ c.btnFg }}; border:1px solid {{ c.border }}; cursor:pointer; text-align:left;\" style-hover=\"opacity:0.85;\">{{ c.btnLabel }}<\u002Fbutton>\n        <div style=\"display:flex; align-items:baseline; gap:10px;\">\n          <div style=\"font-size:14px; font-weight:700; letter-spacing:0.12em;\">{{ c.name }}<\u002Fdiv>\n          <div style=\"font-size:11px; color:#5A5A63;\">{{ c.tag }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.7; color:#8A8A94; max-width:392px;\">{{ c.note }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; align-items:baseline; gap:16px; margin-bottom:10px;\">\n    <div style=\"font-size:12px; letter-spacing:0.18em; color:#0C0C0F; background:#EAEAEA; padding:5px 9px;\">{{ activeName }}<\u002Fdiv>\n    <div style=\"font-size:22px; font-weight:700; letter-spacing:0.06em;\">TEN IDLE VARIATIONS<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:13px; line-height:1.75; color:#8A8A94; max-width:820px; margin-bottom:44px;\">\n    Ten drop-in replacements for the plain idle loop — same 200×200 cell, same anchor, same twelve colours, so firmware can pick one at random whenever the pet has been left alone and nothing else is happening. Each is a clean loop; none of them drift off the cell.\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-wrap:wrap; gap:32px; margin-bottom:56px;\">\n    <sc-for list=\"{{ variations }}\" as=\"v\" hint-placeholder-count=\"10\">\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <div style=\"background:#000; padding:14px; border:1px solid #23232A;\">\n          <canvas ref=\"{{ v.screenRef }}\" width=\"368\" height=\"448\" style=\"display:block; width:368px; height:448px; image-rendering:pixelated;\"><\u002Fcanvas>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:10px;\">\n          <div style=\"font-size:14px; font-weight:700; letter-spacing:0.12em;\">{{ v.name }}<\u002Fdiv>\n          <div style=\"font-size:11px; color:#5A5A63; letter-spacing:0.08em;\">{{ v.spec }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.7; color:#8A8A94; max-width:392px;\">{{ v.note }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin-bottom:18px;\">VARIATION FRAMES — 1:1, EACH CELL 200×200<\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap:28px;\">\n    <sc-for list=\"{{ variations }}\" as=\"v\" hint-placeholder-count=\"10\">\n      <div>\n        <div style=\"font-size:12px; letter-spacing:0.12em; color:#8A8A94; margin-bottom:10px;\">{{ v.sheetName }}<\u002Fdiv>\n        <div style=\"display:flex; gap:2px; background:#000; padding:2px; border:1px solid #23232A; width:fit-content;\">\n          <sc-for list=\"{{ v.frames }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div>\n              <canvas ref=\"{{ f.ref }}\" width=\"200\" height=\"200\" style=\"display:block; width:200px; height:200px; image-rendering:pixelated;\"><\u002Fcanvas>\n              <div style=\"font-size:10px; letter-spacing:0.1em; color:#4A4A52; padding:6px 4px 4px;\">{{ f.file }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n<\u002Fsection>\n<section style=\"padding:56px 64px 96px; font-family:'JetBrains Mono', ui-monospace, monospace; color:#EAEAEA; border-top:1px solid #1C1C22;\">\n\n  <div style=\"display:flex; align-items:baseline; gap:16px; margin-bottom:10px;\">\n    <div style=\"font-size:12px; letter-spacing:0.18em; color:#FF7A5C; background:#1C0F0B; padding:5px 9px;\">NIB<\u002Fdiv>\n    <div style=\"font-size:22px; font-weight:700; letter-spacing:0.06em;\">CLAUDE PET — SPRITE SET<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:13px; line-height:1.75; color:#8A8A94; max-width:820px; margin-bottom:48px;\">\n    Everything below is drawn at final resolution: a 50×50 logical grid at 4× chunky pixels = the 200×200&nbsp;px cell, composited into the real 368×448 black field. Same cell, same anchor, every frame — only the intended parts move. Flat fills and hard cel edges only, 12 colours, no gradients.\n  <\u002Fdiv>\n\n  <div style=\"display:flex; gap:48px; flex-wrap:wrap; margin-bottom:64px;\">\n    <div>\n      <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin-bottom:14px;\">LIVE DEVICE — POKE IT<\u002Fdiv>\n      <div style=\"background:#000; padding:16px; border:1px solid #23232A; width:fit-content;\">\n        <canvas ref=\"{{ demoRef }}\" width=\"368\" height=\"448\" style=\"display:block; width:368px; height:448px; image-rendering:pixelated;\"><\u002Fcanvas>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:flex; flex-direction:column; gap:10px; padding-top:28px;\">\n      <sc-for list=\"{{ buttons }}\" as=\"b\" hint-placeholder-count=\"8\">\n        <button sc-camel-on-click=\"{{ b.onClick }}\" style=\"font-family:inherit; font-size:12px; letter-spacing:0.14em; text-align:left; padding:11px 18px; min-width:220px; background:#15151A; color:#EAEAEA; border:1px solid #2C2C34; cursor:pointer;\" style-hover=\"background:#221410; border-color:#FF7A5C; color:#FF7A5C;\">{{ b.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <div style=\"font-size:11px; line-height:1.8; color:#5A5A63; max-width:220px; margin-top:8px;\">Feed and clean are one-shots — they play once and hand back to idle. Messes stack up to seven along the shelf.<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"padding-top:28px;\">\n      <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin-bottom:14px;\">THE MENU — CLICK TO FEED<\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(4, auto); gap:10px;\">\n        <sc-for list=\"{{ foods }}\" as=\"f\" hint-placeholder-count=\"13\">\n          <button sc-camel-on-click=\"{{ f.onFeed }}\" style=\"font-family:inherit; background:#000; border:1px solid #23232A; padding:8px; display:flex; flex-direction:column; gap:6px; align-items:center; cursor:pointer;\" style-hover=\"border-color:#FFD23F;\">\n            <canvas ref=\"{{ f.ref }}\" style=\"display:block; image-rendering:pixelated;\"><\u002Fcanvas>\n            <div style=\"font-size:10px; letter-spacing:0.1em; color:#8A8A94; text-align:center;\">{{ f.label }}<\u002Fdiv>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:11px; line-height:1.8; color:#5A5A63; max-width:260px; margin-top:14px;\">Each item is its own 40×40 transparent sprite, composited in front of the mouth on the first two frames of the eating animation.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; align-items:baseline; gap:16px; margin-bottom:10px;\">\n    <div style=\"font-size:12px; letter-spacing:0.18em; color:#00E5FF; background:#06161A; padding:5px 9px;\">NEW<\u002Fdiv>\n    <div style=\"font-size:22px; font-weight:700; letter-spacing:0.06em;\">BORN, GONE, AND SAYING HELLO<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:13px; line-height:1.75; color:#8A8A94; max-width:820px; margin-bottom:34px;\">\n    Two one-shots that bracket the pet's life, plus eight pieces of headwear. Nobody says HEY any more — each character has its own greeting, and the bubble sizes itself to the word.\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-wrap:wrap; gap:32px; margin-bottom:48px;\">\n    <sc-for list=\"{{ lifecycle }}\" as=\"l\" hint-placeholder-count=\"3\">\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <div style=\"background:#000; padding:14px; border:1px solid #23232A;\">\n          <canvas ref=\"{{ l.ref }}\" width=\"368\" height=\"448\" style=\"display:block; width:368px; height:448px; image-rendering:pixelated;\"><\u002Fcanvas>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:10px;\">\n          <div style=\"font-size:14px; font-weight:700; letter-spacing:0.12em;\">{{ l.name }}<\u002Fdiv>\n          <div style=\"font-size:11px; color:#5A5A63; letter-spacing:0.08em;\">{{ l.spec }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.7; color:#8A8A94; max-width:392px;\">{{ l.note }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin-bottom:16px;\">FRAME BREAKDOWN — BORN AND GONE<\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap:28px; margin-bottom:56px;\">\n    <sc-for list=\"{{ lifeFrames }}\" as=\"s\" hint-placeholder-count=\"2\">\n      <div>\n        <div style=\"font-size:12px; letter-spacing:0.12em; color:#8A8A94; margin-bottom:10px;\">{{ s.sheetName }}<\u002Fdiv>\n        <div style=\"display:flex; gap:2px; background:#000; padding:2px; border:1px solid #23232A; width:fit-content;\">\n          <sc-for list=\"{{ s.frames }}\" as=\"f\" hint-placeholder-count=\"8\">\n            <div>\n              <canvas ref=\"{{ f.ref }}\" width=\"200\" height=\"200\" style=\"display:block; width:200px; height:200px; image-rendering:pixelated;\"><\u002Fcanvas>\n              <div style=\"font-size:10px; letter-spacing:0.1em; color:#4A4A52; padding:6px 4px 4px;\">{{ f.file }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin-bottom:16px;\">HEADWEAR — CLICK TO WEAR<\u002Fdiv>\n  <div style=\"display:flex; gap:10px; flex-wrap:wrap; margin-bottom:24px;\">\n    <sc-for list=\"{{ hats }}\" as=\"h\" hint-placeholder-count=\"9\">\n      <button sc-camel-on-click=\"{{ h.onPick }}\" style=\"font-family:inherit; font-size:12px; letter-spacing:0.14em; padding:11px 16px; background:{{ h.bg }}; color:{{ h.fg }}; border:1px solid {{ h.border }}; cursor:pointer;\" style-hover=\"border-color:#4FC3F7;\">{{ h.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-wrap:wrap; gap:32px; margin-bottom:72px;\">\n    <sc-for list=\"{{ hats2 }}\" as=\"h\" hint-placeholder-count=\"8\">\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <div style=\"background:#000; padding:14px; border:1px solid #23232A;\">\n          <canvas ref=\"{{ h.ref }}\" width=\"368\" height=\"448\" style=\"display:block; width:368px; height:448px; image-rendering:pixelated;\"><\u002Fcanvas>\n        <\u002Fdiv>\n        <div style=\"font-size:14px; font-weight:700; letter-spacing:0.12em;\">{{ h.name }}<\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.7; color:#8A8A94; max-width:392px;\">{{ h.note }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; align-items:baseline; gap:16px; margin-bottom:10px;\">\n    <div style=\"font-size:12px; letter-spacing:0.18em; color:#0C0C0F; background:#EAEAEA; padding:5px 9px;\">{{ activeName }}<\u002Fdiv>\n    <div style=\"font-size:22px; font-weight:700; letter-spacing:0.06em;\">ACCESSORIES<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:13px; line-height:1.75; color:#8A8A94; max-width:820px; margin-bottom:34px;\">\n    Ten props, each its own transparent sprite with a fixed anchor in the 368×448 field. Most composite in front of the pet; the skateboard and the drum kit sit behind it, so the pet stands on one and plays from inside the other. They bob a pixel with the pet on active frames.\n  <\u002Fdiv>\n  <div style=\"display:flex; gap:10px; flex-wrap:wrap; margin-bottom:28px;\">\n    <sc-for list=\"{{ props }}\" as=\"p\" hint-placeholder-count=\"11\">\n      <button sc-camel-on-click=\"{{ p.onPick }}\" style=\"font-family:inherit; font-size:12px; letter-spacing:0.14em; padding:11px 16px; background:{{ p.bg }}; color:{{ p.fg }}; border:1px solid {{ p.border }}; cursor:pointer;\" style-hover=\"border-color:#FFD23F;\">{{ p.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-wrap:wrap; gap:32px; margin-bottom:72px;\">\n    <sc-for list=\"{{ props2 }}\" as=\"p\" hint-placeholder-count=\"10\">\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <div style=\"background:#000; padding:14px; border:1px solid #23232A;\">\n          <canvas ref=\"{{ p.ref }}\" width=\"368\" height=\"448\" style=\"display:block; width:368px; height:448px; image-rendering:pixelated;\"><\u002Fcanvas>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:10px;\">\n          <div style=\"font-size:14px; font-weight:700; letter-spacing:0.12em;\">{{ p.name }}<\u002Fdiv>\n          <div style=\"font-size:11px; color:#5A5A63; letter-spacing:0.08em;\">{{ p.spec }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.7; color:#8A8A94; max-width:392px;\">{{ p.note }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; align-items:baseline; gap:16px; margin-bottom:10px;\">\n    <div style=\"font-size:12px; letter-spacing:0.18em; color:#0C0C0F; background:#EAEAEA; padding:5px 9px;\">{{ activeName }}<\u002Fdiv>\n    <div style=\"font-size:22px; font-weight:700; letter-spacing:0.06em;\">TIME-ZONE BACKGROUNDS<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"font-size:13px; line-height:1.75; color:#8A8A94; max-width:820px; margin-bottom:34px;\">\n    Six cities across the major zones, each an 8-frame loop at 3&nbsp;fps on its own transparent layer behind the pet. Deliberately sparse: on AMOLED every lit pixel costs power, so these are silhouettes and single-pixel lights on a dim ramp, never a filled sky — the pet stays the brightest thing on the field. Each carries its local time, so the device tells you where the work is happening.\n  <\u002Fdiv>\n  <div style=\"display:flex; gap:10px; flex-wrap:wrap; margin-bottom:28px;\">\n    <sc-for list=\"{{ cities }}\" as=\"c\" hint-placeholder-count=\"7\">\n      <button sc-camel-on-click=\"{{ c.onPick }}\" style=\"font-family:inherit; font-size:12px; letter-spacing:0.14em; padding:11px 16px; background:{{ c.bg }}; color:{{ c.fg }}; border:1px solid {{ c.border }}; cursor:pointer;\" style-hover=\"border-color:#00E5FF;\">{{ c.label }}<\u002Fbutton>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n  <div style=\"display:flex; flex-wrap:wrap; gap:32px; margin-bottom:72px;\">\n    <sc-for list=\"{{ cities2 }}\" as=\"c\" hint-placeholder-count=\"6\">\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <div style=\"background:#000; padding:14px; border:1px solid #23232A;\">\n          <canvas ref=\"{{ c.ref }}\" width=\"368\" height=\"448\" style=\"display:block; width:368px; height:448px; image-rendering:pixelated;\"><\u002Fcanvas>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:10px;\">\n          <div style=\"font-size:14px; font-weight:700; letter-spacing:0.12em;\">{{ c.name }}<\u002Fdiv>\n          <div style=\"font-size:11px; color:#5A5A63; letter-spacing:0.08em;\">{{ c.spec }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.7; color:#8A8A94; max-width:392px;\">{{ c.note }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin-bottom:18px;\">THE SIX STATES, RUNNING AT AUTHORED SPEED<\u002Fdiv>\n  <div style=\"display:flex; flex-wrap:wrap; gap:32px; margin-bottom:72px;\">\n    <sc-for list=\"{{ states }}\" as=\"s\" hint-placeholder-count=\"6\">\n      <div style=\"display:flex; flex-direction:column; gap:12px;\">\n        <div style=\"background:#000; padding:14px; border:1px solid #23232A;\">\n          <canvas ref=\"{{ s.screenRef }}\" width=\"368\" height=\"448\" style=\"display:block; width:368px; height:448px; image-rendering:pixelated;\"><\u002Fcanvas>\n        <\u002Fdiv>\n        <div style=\"display:flex; align-items:baseline; gap:10px;\">\n          <div style=\"font-size:14px; font-weight:700; letter-spacing:0.12em;\">{{ s.name }}<\u002Fdiv>\n          <div style=\"font-size:11px; color:#5A5A63; letter-spacing:0.08em;\">{{ s.spec }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12px; line-height:1.7; color:#8A8A94; max-width:392px;\">{{ s.note }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin-bottom:18px;\">FRAME BREAKDOWN — 1:1, EACH CELL 200×200<\u002Fdiv>\n  <div style=\"display:flex; flex-direction:column; gap:28px; margin-bottom:72px;\">\n    <sc-for list=\"{{ states }}\" as=\"s\" hint-placeholder-count=\"6\">\n      <div>\n        <div style=\"font-size:12px; letter-spacing:0.12em; color:#8A8A94; margin-bottom:10px;\">{{ s.sheetName }}<\u002Fdiv>\n        <div style=\"display:flex; gap:2px; background:#000; padding:2px; border:1px solid #23232A; width:fit-content;\">\n          <sc-for list=\"{{ s.frames }}\" as=\"f\" hint-placeholder-count=\"4\">\n            <div>\n              <canvas ref=\"{{ f.ref }}\" width=\"200\" height=\"200\" style=\"display:block; width:200px; height:200px; image-rendering:pixelated;\"><\u002Fcanvas>\n              <div style=\"font-size:10px; letter-spacing:0.1em; color:#4A4A52; padding:6px 4px 4px;\">{{ f.file }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div style=\"display:flex; gap:72px; flex-wrap:wrap;\">\n    <div>\n      <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin-bottom:18px;\">OBJECT SPRITES — 1:1<\u002Fdiv>\n      <div style=\"display:flex; gap:16px; flex-wrap:wrap; max-width:640px;\">\n        <sc-for list=\"{{ objects }}\" as=\"o\" hint-placeholder-count=\"6\">\n          <div style=\"background:#000; border:1px solid #23232A; padding:10px; display:flex; flex-direction:column; gap:8px; align-items:center;\">\n            <canvas ref=\"{{ o.ref }}\" style=\"display:block; image-rendering:pixelated;\"><\u002Fcanvas>\n            <div style=\"font-size:10px; letter-spacing:0.1em; color:#5A5A63; text-align:center;\">{{ o.label }}<\u002Fdiv>\n            <div style=\"font-size:10px; color:#3E3E46;\">{{ o.size }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div>\n      <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin-bottom:18px;\">{{ paletteHeading }}<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:8px; margin-bottom:36px;\">\n        <sc-for list=\"{{ palette }}\" as=\"p\" hint-placeholder-count=\"12\">\n          <div style=\"display:flex; align-items:center; gap:12px;\">\n            <div style=\"width:22px; height:22px; background:{{ p.hex }}; border:1px solid #23232A;\"><\u002Fdiv>\n            <div style=\"font-size:11px; letter-spacing:0.08em; width:80px;\">{{ p.hex }}<\u002Fdiv>\n            <div style=\"font-size:11px; color:#8A8A94;\">{{ p.role }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin-bottom:18px;\">{{ foodHeading }}<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <sc-for list=\"{{ foodPalette }}\" as=\"p\" hint-placeholder-count=\"16\">\n          <div style=\"display:flex; align-items:center; gap:12px;\">\n            <div style=\"width:22px; height:22px; background:{{ p.hex }}; border:1px solid #23232A;\"><\u002Fdiv>\n            <div style=\"font-size:11px; letter-spacing:0.08em; width:80px;\">{{ p.hex }}<\u002Fdiv>\n            <div style=\"font-size:11px; color:#8A8A94;\">{{ p.role }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin:36px 0 18px;\">{{ hatHeading }}<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <sc-for list=\"{{ hatPalette }}\" as=\"p\" hint-placeholder-count=\"18\">\n          <div style=\"display:flex; align-items:center; gap:12px;\">\n            <div style=\"width:22px; height:22px; background:{{ p.hex }}; border:1px solid #23232A;\"><\u002Fdiv>\n            <div style=\"font-size:11px; letter-spacing:0.08em; width:80px;\">{{ p.hex }}<\u002Fdiv>\n            <div style=\"font-size:11px; color:#8A8A94;\">{{ p.role }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin:36px 0 18px;\">{{ accHeading }}<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <sc-for list=\"{{ accPalette }}\" as=\"p\" hint-placeholder-count=\"16\">\n          <div style=\"display:flex; align-items:center; gap:12px;\">\n            <div style=\"width:22px; height:22px; background:{{ p.hex }}; border:1px solid #23232A;\"><\u002Fdiv>\n            <div style=\"font-size:11px; letter-spacing:0.08em; width:80px;\">{{ p.hex }}<\u002Fdiv>\n            <div style=\"font-size:11px; color:#8A8A94;\">{{ p.role }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:11px; letter-spacing:0.16em; color:#5A5A63; margin:36px 0 18px;\">{{ bgHeading }}<\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:8px;\">\n        <sc-for list=\"{{ bgPalette }}\" as=\"p\" hint-placeholder-count=\"10\">\n          <div style=\"display:flex; align-items:center; gap:12px;\">\n            <div style=\"width:22px; height:22px; background:{{ p.hex }}; border:1px solid #23232A;\"><\u002Fdiv>\n            <div style=\"font-size:11px; letter-spacing:0.08em; width:80px;\">{{ p.hex }}<\u002Fdiv>\n            <div style=\"font-size:11px; color:#8A8A94;\">{{ p.role }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"font-size:11px; line-height:1.8; color:#5A5A63; max-width:300px; margin-top:14px;\">The food items sit on their own ramp so the pet palettes stay at 12–14 colours. Eleven of these sixteen are new; the rest are already in the pet set.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1600,&quot;height&quot;:1100}}\">\nclass Component extends DCLogic {\n  state = { demo: 'idle', mess: 0, messStage: 2, sparkle: false, sparkleCount: 0, char: 'nib', food: 'food_heart', bg: 'toronto', prop: null, hat: null, ringPct: 62, ringPulse: null, ringPulseQ: null };\n  objSizes2 = { hotdog: '40 × 40', burger: '40 × 40', fries: '40 × 40', shake: '40 × 40', coffee: '40 × 40', beer: '40 × 40' };\n  els = { demo: null, screens: {}, frames: {}, compare: {}, cities: {}, props: {}, life: {}, hats: {}, holidays: {}, ringLive: null, ringMiles: {} };\n\n  charNotes = {\n    nib: 'Upright pill with soft round ears and tall bean eyes. Straightest sides of the three, so slumping, squashing and the booty shake read hardest.',\n    bloom: 'The brief\\u2019s hot pink. Widest silhouette, so it carries furthest across a desk; the yellow sprout doubles as a mood antenna and leans over when it gets hungry.',\n    pip: 'Soft periwinkle, coolest on black. Pointed ears and a one-pixel nose give it a creature-not-icon feel, and the ears carry a lot of the expression on their own.',\n    calico: 'Short-haired calico. Cream coat with a ginger patch over one ear and a black patch on the far haunch, white muzzle and chest, pink inner ears, two-pixel whiskers and a ginger tail curling up behind. Patches sit inset so the silhouette stays clean.',\n    trex: 'Tiny arms, big jaw. The head reads as one shape with the body so it stays legible at 50px: eyes up top, a pale jaw with a tooth row under them, yellow spines over the crown and a short tapering tail. The spines and tail move with the bob like everything else.',\n    grilledcheese: 'A square sandwich with toasted crust edges, diagonal griddle marks in the top corner and five cheese drips of varied width hanging off the base. The straightest silhouette in the set, so the squash on hungry and the bounce on working read very hard.',\n    pomchi: 'Long-haired pomchi. Fawn coat drawn as a ruff of one-to-three pixel fur spikes right around the body, cream chest and muzzle, big fluffy ears and a plumed tail fanning out behind. Fluffiest silhouette of the five, softest read on black.'\n  };\n  charPalettes = {\n    nib: [['#FF7A5C', 'hero coral'], ['#C04A31', 'cel shadow / blush'], ['#2E1108', 'ink'], ['#FFB39B', 'tongue tint'], ['#3A1A12', 'ground shadow']],\n    bloom: [['#FF2E88', 'hero hot pink'], ['#B31E63', 'cel shadow / blush'], ['#2A0A18', 'ink'], ['#FF9BC0', 'tongue tint'], ['#3D0C22', 'ground shadow']],\n    pip: [['#8C9EFF', 'hero periwinkle'], ['#4A5AC7', 'cel shadow / blush'], ['#131A3A', 'ink'], ['#C6CFFF', 'tongue tint'], ['#232A5C', 'ground shadow']]\n  };\n  showreel = ['idle', 'working', 'idle_dance', 'idle_wave', 'fed', 'idle_juggle', 'hungry', 'idle_pacing', 'alert', 'sleeping'];\n\n  notes = {\n    idle: 'Gentle breathing bob with a squash on the up-beat, blink on the last frame. Feet and shadow stay planted — only the body, ears and eyes move.',\n    fed: 'Anticipation, a squash-down chomp, then a pop up with closed happy eyes and a yellow heart rising above. Plays once and hands back to idle.',\n    working: 'Six-frame bounce with alternating stubby arms and cyan speed ticks; the sparkle on the last frame keeps the loop from feeling mechanical.',\n    hungry: 'Squashed 2px wider and lower, half-lidded eyes glancing left then right, wobbling mouth, tummy rumble arcs. Two frames per second — visibly sluggish next to idle.',\n    alert: 'Waving arm, wide eyes, and the greeting bubble on its own layer so firmware can pop it independently. The word is per character and the bubble is generated to fit it.',\n    sleeping: 'Two frames of slow breathing with a snore mouth. The Zzz sprite drifts upward over the top, so the loop reads longer than two frames.'\n  };\n  sheetNames = {\n    idle: 'pet_idle_sheet.png — 4 frames, 4 fps, loop',\n    fed: 'pet_fed_sheet.png — 4 frames, 7 fps, one-shot',\n    working: 'pet_working_sheet.png — 6 frames, 9 fps, loop',\n    hungry: 'pet_hungry_sheet.png — 3 frames, 2 fps, loop',\n    alert: 'pet_alert_sheet.png — 4 frames, 6 fps, loop',\n    sleeping: 'pet_sleeping_sheet.png — 2 frames, 1.5 fps, loop'\n  };\n  objSizes = { poop_01: '40 × 40', poop_02: '40 × 40', food_heart: '40 × 40', sparkle: '40 × 40', zzz: '80 × 80', hey_bubble: '132 × 80' };\n\n  varNotes = {\n    idle_pacing: 'Eight-frame walk cycle sweeping 5px each way across the cell, legs and arms counter-swinging, gaze flicking to whichever way it is headed.',\n    idle_jacks: 'Four frames, crisp: crouch, launch, full star with happy eyes, land. Feet leave the ground so the shadow tightens with it.',\n    idle_cartwheel: 'One star pose rotated in 45° steps — nearest-neighbour, so the pixels stay hard-edged. The shadow stays flat on the shelf while the body spins.',\n    idle_dance: 'Six-frame sway, arms alternating overhead, a cyan quaver popping out on whichever side is free.',\n    idle_booty: 'Turns its back — no face, just the nape — and wiggles two px each way. Two shaded cheeks with a crease between them tilt into the wiggle, each keeping a small hero-coloured highlight, with a shade swish trailing the direction of travel.',\n    idle_kiss: 'Hand to mouth, eyes shut, then the hand flicks out and a yellow heart drifts up and away over three frames.',\n    idle_wave: 'The friendly version of the HEY! wave: no bubble, no urgency, arm sweeping high to low with a happy blink on the up-beat.',\n    idle_juggle: 'Three yellow balls on a proper cascade — each ball is one third out of phase, hands alternating under them.',\n    idle_unicycle: 'Rides high on a full-size wheel drawn in front of the body, so it reads as sitting on the wheel rather than behind it. Spokes rotate, the body wobbles a pixel for balance, and headwear sits this one out — the pose needs the cell height the hat would want.',\n    idle_phone: 'Half-lidded eyes down, both hands up holding a slab; the screen alternates lit and dim with a cyan scroll line and two cyan glints on the face.'\n  };\n  varSpecs(k, st) { return st.frames.length + ' frames · ' + st.fps + ' fps · loop'; }\n\n  renderVals() {\n    const P = window.PixelPet;\n    const life = P && P.LIFECYCLE_LIST ? P.LIFECYCLE_LIST : [];\n    const list = P ? P.STATE_LIST.filter(k => life.indexOf(k) < 0) : [];\n    const variations = (P && P.IDLE_LIST ? P.IDLE_LIST : []).map(k => {\n      const st = P.STATES[k];\n      return {\n        key: k,\n        name: st.label,\n        spec: this.varSpecs(k, st),\n        note: this.varNotes[k],\n        sheetName: 'pet_' + k + '_sheet.png — ' + st.frames.length + ' frames, ' + st.fps + ' fps, loop',\n        screenRef: el => { this.els.screens[k] = el; },\n        frames: st.frames.map((_, i) => ({\n          file: 'pet_' + k + '_' + String(i + 1).padStart(2, '0') + '.png',\n          ref: el => { if (el) { this.els.frames[k + i] = { el, k, i }; P.renderPet(el, k, i, this.state.char); } }\n        }))\n      };\n    });\n    const states = list.map(k => {\n      const st = P.STATES[k];\n      return {\n        key: k,\n        name: k.toUpperCase(),\n        spec: st.frames.length + ' frames · ' + st.fps + ' fps · ' + (st.loop ? 'loop' : 'one-shot'),\n        note: this.notes[k],\n        sheetName: this.sheetNames[k],\n        screenRef: el => { this.els.screens[k] = el; },\n        frames: st.frames.map((_, i) => ({\n          file: 'pet_' + k + '_' + String(i + 1).padStart(2, '0') + '.png',\n          ref: el => { if (el) { this.els.frames[k + i] = { el, k, i }; P.renderPet(el, k, i, this.state.char); } }\n        }))\n      };\n    });\n    const chars = (P && P.CHAR_LIST ? P.CHAR_LIST : []).map(key => {\n      const c = P.CHARS[key], on = this.state.char === key;\n      return {\n        key, name: c.name, tag: c.tag, note: this.charNotes[key],\n        border: on ? c.hero : '#23232A',\n        btnBg: on ? c.hero : '#15151A',\n        btnFg: on ? '#0C0C0F' : '#EAEAEA',\n        btnLabel: on ? '\\u25CF  SELECTED' : 'PICK ' + c.name,\n        onSelect: () => this.pick(key),\n        ref: el => { this.els.compare[key] = el; }\n      };\n    });\n    const objects = (P ? P.OBJECT_LIST : []).map(k => ({\n      key: k,\n      label: P.OBJECTS[k].label,\n      size: this.objSizes[k],\n      ref: el => { if (el) P.renderObject(el, k, 4); }\n    }));\n    if (P && P.greetBubble) {\n      const word = P.GREETINGS[this.state.char] || 'HI!';\n      const bub = P.greetBubble(word);\n      objects.push({\n        key: 'greeting', label: 'GREETING — ' + word, size: (bub.w * 4) + ' × ' + (bub.h * 4) + ' (generated)',\n        ref: el => { if (el) P.toCanvas(bub, 4, el); }\n      });\n    }\n    const mk = (label, fn) => ({ label, onClick: fn });\n    const set = (s) => () => this.setState({ demo: s });\n    const feed = key => {\n      this.setState({ demo: 'fed', food: key });\n      clearTimeout(this.to);\n      this.to = setTimeout(() => this.setState({ demo: 'idle' }), 1100);\n    };\n    const foods = (P && P.FOOD_LIST ? P.FOOD_LIST : []).map(k => ({\n      key: k,\n      label: P.OBJECTS[k].label.replace('FOOD / ', ''),\n      size: '40 × 40',\n      on: this.state.food === k,\n      onFeed: () => feed(k),\n      ref: el => { if (el) P.renderObject(el, k, 4); }\n    }));\n    const buttons = [\n      mk('FEED  →  EATING', () => feed(this.state.food)),\n      mk('PROMPT RUNNING  →  WORKING', set('working')),\n      mk('SETTLE  →  IDLE', set('idle')),\n      mk('IGNORE  →  HUNGRY', set('hungry')),\n      mk('STILL IGNORED  →  HEY!', set('alert')),\n      mk('NIGHT  →  SLEEPING', set('sleeping')),\n      mk('DOZE OFF  →  RANDOM NAP', () => {\n        const list = P && P.NAP_LIST ? P.NAP_LIST : ['sleeping'];\n        this.setState({ demo: list[Math.floor(Math.random() * list.length)] });\n      }),\n      mk('HATCH  →  BORN', () => { this.setState({ demo: 'birth' }); clearTimeout(this.to); this.to = setTimeout(() => this.setState({ demo: 'idle' }), 1500); }),\n      mk('LET IT GO  →  BYE', () => { this.setState({ demo: 'death' }); clearTimeout(this.to); this.to = setTimeout(() => this.setState({ demo: 'idle' }), 2000); }),\n      mk('DROP A MESS  (MAX 7)', () => {\n        this.setState(st => ({ mess: Math.min(st.mess + 1, 7), messStage: 1 }));\n        clearTimeout(this.pt);\n        this.pt = setTimeout(() => this.setState({ messStage: 2 }), 350);\n      }),\n      mk('TAP TO CLEAN ALL', () => {\n        this.setState(st => ({ sparkleCount: st.mess, mess: 0, sparkle: true }));\n        clearTimeout(this.st);\n        this.st = setTimeout(() => this.setState({ sparkle: false }), 450);\n      })\n    ];\n    const src = (active0 => active0 && active0.palette ? active0.palette : (this.charPalettes[this.state.char] || []))(P && P.CHARS ? P.CHARS[this.state.char] : null);\n    const own = src.map(([hex, role]) => ({ hex, role }));\n    const seen = {};\n    const palette = [{ hex: '#000000', role: 'field — pixels off on AMOLED' }]\n      .concat(own)\n      .concat([\n        { hex: '#FFFFFF', role: 'eye shine' },\n        { hex: '#FFD23F', role: 'food, hearts, sparks' },\n        { hex: '#00E5FF', role: 'alert — bubble, speed ticks' },\n        { hex: '#7A5230', role: 'mess' },\n        { hex: '#5C3B22', role: 'mess shadow' },\n        { hex: '#EAEAEA', role: 'status type, Zzz' }\n      ])\n      .filter(p => (seen[p.hex] ? false : (seen[p.hex] = true)));\n    const active = P && P.CHARS ? P.CHARS[this.state.char] : null;\n    const foodPalette = (P && P.FOOD_PALETTE ? P.FOOD_PALETTE : []).map(([hex, role]) => ({ hex, role }));\n    const bgPalette = (P && P.BG_PALETTE ? P.BG_PALETTE : []).map(([hex, role]) => ({ hex, role }));\n    const bgKeys = P && P.BG_LIST ? P.BG_LIST : [];\n    const cities = [{ key: null, name: 'NONE', label: 'PURE BLACK' }].concat(bgKeys.map(k => ({ key: k, name: P.BACKGROUNDS[k].name, label: P.BACKGROUNDS[k].name }))).map(c => {\n      const on = this.state.bg === c.key;\n      return {\n        key: c.key, label: c.label,\n        bg: on ? '#00E5FF' : '#15151A',\n        fg: on ? '#06161A' : '#EAEAEA',\n        border: on ? '#00E5FF' : '#2C2C34',\n        onPick: () => this.setState({ bg: c.key })\n      };\n    });\n    const lifeNotes = {\n      birth: 'Egg lands and wobbles, cracks over two frames, then the shell halves fall away as the pet rises through them and throws its arms up. Eight frames, plays once, hands off to idle.',\n      death: 'Kept cute: the pet closes its eyes, keels over flat, and a little ghost of itself lifts off with a yellow halo and a scalloped hem, waving once as it thins out by dithering. Seven frames, plays once.',\n      alert: 'The greeting is per character — HI!, OI!, YO!, MEOW, YIP! — and the bubble measures itself to the word, so a four-letter MEOW gets a wider box than HI!.'\n    };\n    const lifeKeys = ['birth', 'death', 'alert'];\n    const lifecycle = (P && P.STATES && P.STATES.birth ? lifeKeys : []).map(k => {\n      const st = P.STATES[k];\n      return {\n        key: k, name: k === 'alert' ? 'HELLO' : st.label, note: lifeNotes[k],\n        spec: st.frames.length + ' frames · ' + st.fps + ' fps · ' + (st.loop ? 'loop' : 'one-shot'),\n        ref: el => { this.els.life[k] = el; }\n      };\n    });\n    const lifeFrames = (P && P.STATES && P.STATES.birth ? ['birth', 'death'] : []).map(k => {\n      const st = P.STATES[k];\n      return {\n        sheetName: 'pet_' + k + '_sheet.png — ' + st.frames.length + ' frames, ' + st.fps + ' fps, one-shot',\n        frames: st.frames.map((_, i) => ({\n          file: 'pet_' + k + '_' + String(i + 1).padStart(2, '0') + '.png',\n          ref: el => { if (el) { this.els.frames[k + i] = { el, k, i }; P.renderPet(el, k, i, this.state.char); } }\n        }))\n      };\n    });\n    const hatKeys = P && P.HAT_LIST ? P.HAT_LIST : [];\n    const hats = [{ key: null, label: 'BARE HEAD' }].concat(hatKeys.map(k => ({ key: k, label: P.HATS[k].label }))).map(c => {\n      const on = this.state.hat === c.key;\n      return {\n        key: c.key, label: c.label,\n        bg: on ? '#4FC3F7' : '#15151A',\n        fg: on ? '#06161A' : '#EAEAEA',\n        border: on ? '#4FC3F7' : '#2C2C34',\n        onPick: () => this.setState({ hat: c.key })\n      };\n    });\n    const hats2 = hatKeys.map(k => ({\n      key: k, name: P.HATS[k].label, note: P.HATS[k].note,\n      ref: el => { this.els.hats[k] = el; }\n    }));\n    const rest = (P && P.REST_LIST ? P.REST_LIST : []).map(k => {\n      const st = P.STATES[k];\n      return {\n        key: k, name: st.label, note: st.note, group: st.group === 'nap' ? 'NAP' : 'SLEEP',\n        tagColor: st.group === 'nap' ? '#FFD23F' : '#00E5FF',\n        spec: st.frames.length + ' frames · ' + st.fps + ' fps · loop',\n        file: 'pet_' + k + '_01…' + String(st.frames.length).padStart(2, '0') + '.png  +  pet_' + k + '_sheet.png',\n        screenRef: el => { this.els.screens[k] = el; },\n        frames: st.frames.map((_, i) => ({\n          n: String(i + 1).padStart(2, '0'),\n          ref: el => { if (el) { this.els.frames[k + i] = { el, k, i }; P.renderPet(el, k, i, this.state.char, this.state.hat); } }\n        }))\n      };\n    });\n    const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];\n    const todayKey = P && P.holidayForDate ? P.holidayForDate(new Date()) : null;\n    const dayKeys = P && P.DAY_LIST ? P.DAY_LIST : [];\n    const mkHoliday = k => {\n      const h = P.HOLIDAYS[k];\n      return {\n        key: k, name: h.name, when: h.when, note: h.note, month: MON[h.month],\n        border: k === todayKey ? '#00E5FF' : '#23232A',\n        palette: h.palette.map(([hex, role]) => ({ hex, role })),\n        ref: el => { this.els.holidays[k] = el; }\n      };\n    };\n    const holidays = (P && P.HOLIDAY_LIST ? P.HOLIDAY_LIST : []).filter(k => dayKeys.indexOf(k) < 0).map(mkHoliday);\n    const dayHolidays = dayKeys.map(mkHoliday);\n    const hasRing = !!(P && P.ringOverlay);\n    const pct = this.state.ringPct;\n    const q = hasRing ? P.quarterOf(pct / 100) : 1;\n    /* the quarter that just CLOSED is the boundary behind the head, not the one in progress */\n    const closedQ = this.state.ringPulseQ;\n    const stripQ = closedQ || Math.max(1, Math.min(4, Math.ceil(pct / 25) || 1));\n    const ringJumps = [\n      { label: 'Q1 CLOSE', v: 25 }, { label: 'Q2 CLOSE', v: 50 },\n      { label: 'Q3 CLOSE', v: 75 }, { label: 'FULL YEAR', v: 100 }, { label: 'RESET', v: 0 }\n    ].map(j => ({ label: j.label, onClick: () => this.jumpRing(j.v) }));\n    const ringPulseFrames = (hasRing ? [0, 1, 2, 3] : []).map(f => ({\n      file: 'ring_pulse_q' + stripQ + '_0' + (f + 1) + '.png',\n      ref: el => { if (el) P.toCanvas(P.ringPulse(stripQ, f), 4, el); }\n    }));\n    const ringMilestones = (hasRing ? [0, 25, 50, 75, 100] : []).map(v => ({\n      label: v === 0 ? 'YEAR OPEN' : 'Q' + Math.ceil(v / 25) + ' CLOSED',\n      ref: el => { this.els.ringMiles[v] = { el, v }; }\n    }));\n    const ringSteps = (hasRing ? Array.from({ length: 21 }, (_, i) => i * 5) : []).map(v => ({\n      label: v + '%',\n      ref: el => { if (el) P.toCanvas(P.ringOverlay(v / 100), 2, el); }\n    }));\n    const accKeys = P && P.ACC_LIST ? P.ACC_LIST : [];\n    const props = [{ key: null, label: 'NO PROP' }].concat(accKeys.map(k => ({ key: k, label: P.ACCESSORIES[k].label }))).map(c => {\n      const on = this.state.prop === c.key;\n      return {\n        key: c.key, label: c.label,\n        bg: on ? '#FFD23F' : '#15151A',\n        fg: on ? '#0C0C0F' : '#EAEAEA',\n        border: on ? '#FFD23F' : '#2C2C34',\n        onPick: () => this.setState({ prop: c.key })\n      };\n    });\n    const props2 = accKeys.map(k => {\n      const a = P.ACCESSORIES[k];\n      return {\n        key: k, name: a.label, note: a.note,\n        spec: (a.w * 4) + ' × ' + (a.h * 4) + ' · ' + (a.behind ? 'behind pet' : 'in front'),\n        ref: el => { this.els.props[k] = el; }\n      };\n    });\n    const cities2 = bgKeys.map(k => {\n      const b = P.BACKGROUNDS[k];\n      return {\n        key: k, name: b.name, note: b.note,\n        spec: b.tz + ' · local ' + b.time + ' · 8 frames · 3 fps · loop',\n        ref: el => { this.els.cities[k] = el; }\n      };\n    });\n    return {\n      states, variations, chars, objects, buttons, palette, foods, foodPalette, cities, cities2, bgPalette,\n      rest, holidays, dayHolidays,\n      todayHoliday: todayKey && P.HOLIDAYS[todayKey] ? P.HOLIDAYS[todayKey].name : '',\n      lifecycle, lifeFrames, hats, hats2,\n      ringJumps, ringPulseFrames, ringMilestones, ringSteps,\n      ringPct: String(pct),\n      ringReadout: closedQ\n        ? 'Q' + closedQ + ' CLOSED   ' + pct + '% OF YEAR'\n        : 'Q' + q + ' IN PROGRESS   ' + pct + '% OF YEAR',\n      ringStripCaption: closedQ ? 'PLAYING NOW — Q' + closedQ + ' CLOSE' : 'NEXT BOUNDARY — Q' + stripQ + ' CLOSE',\n      onRingScrub: e => this.setState({ ringPct: Number(e.target.value), ringPulse: null, ringPulseQ: null }),\n      ringLiveRef: el => { this.els.ringLive = el; },\n      hatPalette: (P && P.HAT_PALETTE ? P.HAT_PALETTE : []).map(([hex, role]) => ({ hex, role })),\n      hatHeading: 'HAT RAMP — ' + (P && P.HAT_PALETTE ? P.HAT_PALETTE.length : 0) + ' COLOURS',\n      props, props2, accPalette: (P && P.ACC_PALETTE ? P.ACC_PALETTE : []).map(([hex, role]) => ({ hex, role })),\n      accHeading: 'PROP RAMP — ' + (P && P.ACC_PALETTE ? P.ACC_PALETTE.length : 0) + ' COLOURS',\n      foodHeading: 'FOOD RAMP — ' + foodPalette.length + ' COLOURS',\n      bgHeading: 'BACKGROUND RAMP — ' + bgPalette.length + ' COLOURS',\n      activeName: active ? active.name : '',\n      paletteHeading: 'PALETTE — ' + palette.length + ' COLOURS',\n      demoRef: el => { this.els.demo = el; }\n    };\n  }\n\n  componentDidMount() {\n    this.t0 = performance.now();\n    this.iv = setInterval(() => this.tick(), 80);\n    if (!(window.PixelPet && window.PixelPet.IDLE_LIST)) {\n      this.wait = setInterval(() => {\n        if (window.PixelPet && window.PixelPet.IDLE_LIST) { clearInterval(this.wait); this.forceUpdate(); }\n      }, 100);\n    }\n  }\n  componentWillUnmount() { [this.iv, this.wait, this.to, this.pt, this.st].forEach(clearInterval); }\n\n  jumpRing(v) {\n    const closing = v % 25 === 0 && v > 0;\n    this.setState({\n      ringPct: v,\n      ringPulse: closing ? performance.now() : null,\n      ringPulseQ: closing ? Math.round(v / 25) : null\n    });\n    clearTimeout(this.rt);\n    if (closing) this.rt = setTimeout(() => this.setState({ ringPulse: null, ringPulseQ: null }), 620);\n  }\n  pick(key) {\n    this.setState({ char: key }, () => this.paintFrames());\n  }\n  paintFrames() {\n    const P = window.PixelPet;\n    if (!P) return;\n    for (const id in this.els.frames) {\n      const f = this.els.frames[id];\n      if (f && f.el) P.renderPet(f.el, f.k, f.i, this.state.char, this.state.hat);\n    }\n  }\n  visible(el) {\n    if (!el) return false;\n    const r = el.getBoundingClientRect();\n    return r.bottom > -240 && r.top < window.innerHeight + 240;\n  }\n  tick() {\n    const P = window.PixelPet;\n    if (!P) return;\n    const sig = [P.IDLE_LIST, P.HAT_LIST, P.ACC_LIST, P.HOLIDAY_LIST, P.REST_LIST].map(a => a ? a.length : 0).join('/') + (P.ringOverlay ? '/r' : '');\n    if (this._sig !== sig) { this._sig = sig; this.forceUpdate(); }\n    const ms = performance.now() - this.t0;\n    const char = this.state.char;\n    for (const k in this.els.screens) {\n      const el = this.els.screens[k];\n      if (this.visible(el)) P.renderScreen(el, k, ms, { char });\n    }\n    for (const k in this.els.cities) {\n      const el = this.els.cities[k];\n      if (this.visible(el)) P.renderScreen(el, 'idle', ms, { char, bg: k });\n    }\n    for (const k in this.els.holidays) {\n      const el = this.els.holidays[k];\n      if (this.visible(el)) P.renderScreen(el, 'idle', ms, { char, bg: k });\n    }\n    if (P.ringOverlay) {\n      if (this.visible(this.els.ringLive)) {\n        const opts = { state: this.state.demo === 'idle' ? 'idle' : this.state.demo };\n        if (this.state.ringPulse != null) {\n          opts.pulse = Math.min(3, Math.floor((performance.now() - this.state.ringPulse) / 125));\n          opts.q = this.state.ringPulseQ;\n        }\n        P.renderRing(this.els.ringLive, this.state.ringPct / 100, char, ms, opts, 4);\n      }\n      for (const k in this.els.ringMiles) {\n        const m = this.els.ringMiles[k];\n        if (m && this.visible(m.el)) P.renderRing(m.el, m.v / 100, char, ms, {}, 2);\n      }\n    }\n    for (const k in this.els.life) {\n      const el = this.els.life[k];\n      if (this.visible(el)) P.renderScreen(el, k, ms, { char });\n    }\n    for (const k in this.els.hats) {\n      const el = this.els.hats[k];\n      if (this.visible(el)) P.renderScreen(el, 'idle', ms, { char, hat: k, label: P.HATS[k].short });\n    }\n    for (const k in this.els.props) {\n      const el = this.els.props[k];\n      if (this.visible(el)) {\n        const st = k === 'skateboard' || k === 'drums' ? 'working' : k === 'mic' ? 'alert' : 'idle';\n        P.renderScreen(el, st, ms, { char, prop: k, label: P.ACCESSORIES[k].label.split(' ')[0] });\n      }\n    }\n    const reelState = this.showreel[Math.floor(ms / 2600) % this.showreel.length];\n    for (const key in this.els.compare) {\n      const el = this.els.compare[key];\n      if (this.visible(el)) P.renderScreen(el, reelState, ms, { char: key });\n    }\n    if (this.els.demo) {\n      P.renderScreen(this.els.demo, this.state.demo, ms, {\n        char, food: this.state.food, bg: this.state.bg, prop: this.state.prop, hat: this.state.hat,\n        mess: this.state.mess, messStage: this.state.messStage,\n        sparkle: this.state.sparkle, sparkleCount: this.state.sparkleCount\n      });\n    }\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
