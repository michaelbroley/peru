document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

 style=\"font-family:Anton,sans-serif;font-size:30px;line-height:.85;color:#FFC300\">5<\u002Fdiv>\n        <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;margin-top:6px\">Stops<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#E4007C;padding:11px 10px\">\n        <div style=\"font-family:Anton,sans-serif;font-size:30px;line-height:.85;color:#FFC300\">3,800<\u002Fdiv>\n        <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;margin-top:6px\">Metres up<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"position:sticky;top:0;z-index:40;background:#12100F;color:#FFFBF5;padding:10px 14px;display:grid;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.28)\">\n    <div style=\"display:flex;gap:6px;overflow-x:auto;font:600 11px/1 'Work Sans';letter-spacing:.12em;text-transform:uppercase\">\n      <a href=\"#snapshot\" style=\"color:#FFFBF5;text-decoration:none;padding:7px 10px;border:1px solid rgba(255,251,245,.28);border-radius:999px;white-space:nowrap\">Snapshot<\u002Fa>\n      <a href=\"#weather\" style=\"color:#FFFBF5;text-decoration:none;padding:7px 10px;border:1px solid rgba(255,251,245,.28);border-radius:999px;white-space:nowrap\">Weather<\u002Fa>\n      <a href=\"#days\" style=\"color:#FFFBF5;text-decoration:none;padding:7px 10px;border:1px solid rgba(255,251,245,.28);border-radius:999px;white-space:nowrap\">Days<\u002Fa>\n      <a href=\"#packing\" style=\"color:#FFFBF5;text-decoration:none;padding:7px 10px;border:1px solid rgba(255,251,245,.28);border-radius:999px;white-space:nowrap\">Packing<\u002Fa>\n      <a href=\"#book\" style=\"color:#FFFBF5;text-decoration:none;padding:7px 10px;border:1px solid rgba(255,251,245,.28);border-radius:999px;white-space:nowrap\">Book ahead<\u002Fa>\n    <\u002Fdiv>\n    <div style=\"display:flex;gap:6px;align-items:center\">\n      <span style=\"font:600 10px/1 'Work Sans';letter-spacing:.14em;text-transform:uppercase;opacity:.5\">Lens<\u002Fspan>\n      <button type=\"button\" sc-camel-on-click=\"{{ lensAll }}\" style=\"{{ chipAll }}\">All<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ lensFood }}\" style=\"{{ chipFood }}\">Laura’s food<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ lensSkate }}\" style=\"{{ chipSkate }}\">Michael’s skate<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"snapshot\" style=\"padding:30px 22px 6px\">\n    <div style=\"font-family:Anton,sans-serif;font-size:44px;line-height:.78;color:transparent;-webkit-text-stroke:1.5px #E4007C\">01<\u002Fdiv>\n    <div style=\"font-family:Anton,sans-serif;font-size:34px;line-height:1;text-transform:uppercase;margin:8px 0 18px\">Trip snapshot<\u002Fdiv>\n\n    <div style=\"display:grid;gap:1px;background:rgba(18,16,15,.14);border:1px solid rgba(18,16,15,.14)\">\n      <div style=\"background:#FFFBF5;padding:14px 15px\">\n        <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Arrive<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.45;margin-top:5px\">Wed Sept 16, <strong>6:55 AM<\u002Fstrong> — Air Transat 150 from Montreal (YUL). Seats 26C &amp; 26H.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFBF5;padding:14px 15px\">\n        <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Depart<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.45;margin-top:5px\">Sat Sept 26, <strong>8:25 AM<\u002Fstrong> — Air Transat 151 to Montreal (arrives 5:45 PM). Seats 26H &amp; 26J.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFBF5;padding:14px 15px\">\n        <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Free days<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.45;margin-top:5px\">Sept 16 &amp; 17 in Lima; free evening Sept 25.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFBF5;padding:14px 15px\">\n        <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Tour meeting point<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.45;margin-top:5px\">Hotel El Señorial, <a href=\"https://www.google.com/maps/search/?api=1&amp;query=Hotel+El+Se%C3%B1orial+Calle+Jos%C3%A9+Gonz%C3%A1les+567+Miraflores+Lima\" target=\"_blank\" rel=\"noopener\">Calle José Gonzáles 567, Miraflores, Lima<\u002Fa>. Welcome meeting Day 1 (Sept 18) at 2:00 PM.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFBF5;padding:14px 15px\">\n        <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Included meals on tour<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.45;margin-top:5px\">8 breakfasts, 2 lunches, 1 dinner.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFBF5;padding:14px 15px\">\n        <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Luggage<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.45;margin-top:5px\">Main bags stay at hotels in Cusco and Puno — pack a daypack for Aguas Calientes (Sept 20–21) and the Lake Titicaca homestay (Sept 24).<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:18px;background:#12100F;color:#FFFBF5;padding:16px 16px 17px\">\n      <div style=\"display:flex;align-items:center;gap:8px\">\n        <span style=\"display:inline-block;width:8px;height:8px;border-radius:50%;background:#E4007C\"><\u002Fspan>\n        <span style=\"font:700 11px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase\">Altitude<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:15px;line-height:1.5;margin-top:9px;text-wrap:pretty\">Sea level in Lima → <strong>Cusco 3,450 m<\u002Fstrong> (Sept 19) → <strong>Lake Titicaca 3,800 m<\u002Fstrong> (Sept 23–24). Go slow, hydrate, ask a doctor about altitude meds.<\u002Fdiv>\n      <div style=\"display:flex;gap:2px;margin-top:14px;align-items:flex-end;height:44px\">\n        <div style=\"flex:1;height:6%;background:rgba(255,251,245,.25)\"><\u002Fdiv>\n        <div style=\"flex:1;height:6%;background:rgba(255,251,245,.25)\"><\u002Fdiv>\n        <div style=\"flex:1;height:6%;background:rgba(255,251,245,.25)\"><\u002Fdiv>\n        <div style=\"flex:1;height:91%;background:#E4007C\"><\u002Fdiv>\n        <div style=\"flex:1;height:76%;background:#E4007C\"><\u002Fdiv>\n        <div style=\"flex:1;height:91%;background:#E4007C\"><\u002Fdiv>\n        <div style=\"flex:1;height:91%;background:#E4007C\"><\u002Fdiv>\n        <div style=\"flex:1;height:100%;background:#FFC300\"><\u002Fdiv>\n        <div style=\"flex:1;height:100%;background:#FFC300\"><\u002Fdiv>\n        <div style=\"flex:1;height:6%;background:rgba(255,251,245,.25)\"><\u002Fdiv>\n        <div style=\"flex:1;height:6%;background:rgba(255,251,245,.25)\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;justify-content:space-between;font:600 9px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase;opacity:.55;margin-top:6px\">\n        <span>16 Lima<\u002Fspan><span>19 Cusco<\u002Fspan><span>24 Titicaca<\u002Fspan><span>26 Home<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"margin-top:18px;border:2px solid #E4007C;padding:16px\">\n      <div style=\"font:700 11px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase;color:#E4007C\">★ Booked reservations<\u002Fdiv>\n      <div style=\"margin-top:12px;font-size:15px;line-height:1.5\">\n        <strong>Lady Bee<\u002Fstrong> — Wed Sept 16, 20:00. <a href=\"https://www.google.com/maps/search/?api=1&amp;query=Lady+Bee+Av.+Pedro+de+Osma+205+Barranco+Lima\" target=\"_blank\" rel=\"noopener\">Av. Pedro de Osma 205, Barranco, Lima<\u002Fa>. Phone <a href=\"tel:+5114383775\">+51 1 438 3775<\u002Fa>. Peru’s top-ranked cocktail bar; small plates too.\n      <\u002Fdiv>\n      <div style=\"margin-top:12px;padding-top:12px;border-top:1px solid rgba(18,16,15,.14);font-size:15px;line-height:1.5\">\n        <strong>Maido<\u002Fstrong> — Thu Sept 17, evening. <a href=\"https://www.google.com/maps/search/?api=1&amp;query=Maido+Calle+San+Mart%C3%ADn+399+Miraflores+Lima\" target=\"_blank\" rel=\"noopener\">Calle San Martín 399, Miraflores, Lima<\u002Fa>. Mitsuharu Tsumura’s Nikkei tasting menu; reconfirm day before, flag dietary needs, smart-casual.\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showMaps }}\" hint-placeholder-val=\"{{ true }}\">\n      <div style=\"margin-top:22px;border:1px solid rgba(18,16,15,.14)\">\n        <iframe src=\"about:blank#b47b48c5-ef5f-457d-8855-b349e3c80475\" height=\"{{ bigMapH }}\" title=\"Route map of the trip\"><\u002Fiframe>\n        <div style=\"padding:9px 12px;font:500 11px/1.4 'Work Sans';color:rgba(18,16,15,.55);border-top:1px solid rgba(18,16,15,.14)\">The whole route. Gold pins are the highlights — tap any pin.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n\n  <div id=\"weather\" style=\"padding:34px 22px 6px\">\n    <div style=\"font-family:Anton,sans-serif;font-size:44px;line-height:.78;color:transparent;-webkit-text-stroke:1.5px #E4007C\">02<\u002Fdiv>\n    <div style=\"font-family:Anton,sans-serif;font-size:34px;line-height:1;text-transform:uppercase;margin:8px 0 10px\">Weather<\u002Fdiv>\n    <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.6);max-width:40ch\">September, ~50-year averages. Dry-season conditions, thinner crowds. Plan for the day/night swing more than rain — strong high-altitude sun burns even when cool, so sunscreen daily.<\u002Fdiv>\n\n    <div style=\"display:grid;gap:12px;margin-top:18px\">\n      <div style=\"border:1px solid rgba(18,16,15,.14);border-top:6px solid #E4007C;padding:14px 15px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n          <span style=\"font-family:Anton,sans-serif;font-size:20px;text-transform:uppercase\">Lima<\u002Fspan>\n          <span style=\"font:600 11px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase;color:rgba(18,16,15,.5)\">Sea level<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;margin-top:9px;align-items:baseline\">\n          <span style=\"font-family:Anton,sans-serif;font-size:26px;color:#E4007C\">~20°<\u002Fspan>\n          <span style=\"font-family:Anton,sans-serif;font-size:26px;color:rgba(18,16,15,.35)\">~15°<\u002Fspan>\n          <span style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(18,16,15,.5)\">Rain near-zero<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.45;margin-top:8px\">Grey, damp coastal fog (garúa); little sun.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(18,16,15,.14);border-top:6px solid #FFC300;padding:14px 15px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n          <span style=\"font-family:Anton,sans-serif;font-size:20px;text-transform:uppercase\">Cusco<\u002Fspan>\n          <span style=\"font:600 11px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase;color:rgba(18,16,15,.5)\">3,400 m<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;margin-top:9px;align-items:baseline\">\n          <span style=\"font-family:Anton,sans-serif;font-size:26px;color:#E4007C\">~21°<\u002Fspan>\n          <span style=\"font-family:Anton,sans-serif;font-size:26px;color:rgba(18,16,15,.35)\">~4°<\u002Fspan>\n          <span style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(18,16,15,.5)\">Mostly dry<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.45;margin-top:8px\">Warm sun, extreme UV, cold nights.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(18,16,15,.14);border-top:6px solid #E4007C;padding:14px 15px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n          <span style=\"font-family:Anton,sans-serif;font-size:20px;text-transform:uppercase\">Sacred Valley / Machu Picchu<\u002Fspan>\n          <span style=\"font:600 11px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase;color:rgba(18,16,15,.5);white-space:nowrap\">2,000–2,900 m<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;margin-top:9px;align-items:baseline\">\n          <span style=\"font-family:Anton,sans-serif;font-size:26px;color:#E4007C\">~17°<\u002Fspan>\n          <span style=\"font-family:Anton,sans-serif;font-size:26px;color:rgba(18,16,15,.35)\">~6°<\u002Fspan>\n          <span style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(18,16,15,.5)\">Odd shower<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.45;margin-top:8px\">Milder days, cloud-forest humidity.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid rgba(18,16,15,.14);border-top:6px solid #12100F;padding:14px 15px\">\n        <div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:10px\">\n          <span style=\"font-family:Anton,sans-serif;font-size:20px;text-transform:uppercase\">Puno / Lake Titicaca<\u002Fspan>\n          <span style=\"font:600 11px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase;color:rgba(18,16,15,.5)\">3,800 m<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:14px;margin-top:9px;align-items:baseline\">\n          <span style=\"font-family:Anton,sans-serif;font-size:26px;color:#E4007C\">~16°<\u002Fspan>\n          <span style=\"font-family:Anton,sans-serif;font-size:26px;color:rgba(18,16,15,.35)\">~0 to −1°<\u002Fspan>\n          <span style=\"font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:rgba(18,16,15,.5)\">Very dry<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font-size:14px;line-height:1.45;margin-top:8px\">Intense sun by day, freezing nights.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"days\" style=\"padding:34px 22px 6px\">\n    <div style=\"font-family:Anton,sans-serif;font-size:44px;line-height:.78;color:transparent;-webkit-text-stroke:1.5px #E4007C\">03<\u002Fdiv>\n    <div style=\"font-family:Anton,sans-serif;font-size:34px;line-height:1;text-transform:uppercase;margin:8px 0 12px\">Day by day<\u002Fdiv>\n    <div style=\"display:flex;gap:8px\">\n      <button type=\"button\" sc-camel-on-click=\"{{ expandAll }}\" style=\"font:600 10px/1 'Work Sans';letter-spacing:.14em;text-transform:uppercase;background:#12100F;color:#FFFBF5;border:0;padding:9px 12px;cursor:pointer\">Expand all<\u002Fbutton>\n      <button type=\"button\" sc-camel-on-click=\"{{ collapseAll }}\" style=\"font:600 10px/1 'Work Sans';letter-spacing:.14em;text-transform:uppercase;background:transparent;color:#12100F;border:1px solid rgba(18,16,15,.3);padding:9px 12px;cursor:pointer\">Collapse all<\u002Fbutton>\n    <\u002Fdiv>\n\n    <div data-days=\"1\" style=\"margin-top:8px\">\n\n      <div style=\"background:#12100F;color:#FFFBF5;padding:15px 16px;margin-top:22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n        <span style=\"font-family:Anton,sans-serif;font-size:23px;line-height:1;text-transform:uppercase\">Lima<\u002Fspan>\n        <span style=\"font:700 10px/1.3 'Work Sans';letter-spacing:.14em;text-transform:uppercase;color:#FFC300\">Sept 16–18 · sea level<\u002Fspan>\n      <\u002Fdiv>\n      <details data-screen-label=\"Sept 16\" style=\"border-top:1px solid rgba(18,16,15,.16)\">\n        <summary style=\"cursor:pointer;padding:20px 0;display:grid;grid-template-columns:54px 1fr;gap:0 14px;align-items:start\">\n          <div style=\"display:grid;justify-items:center;gap:3px;padding-top:2px\">\n            <div style=\"font-family:Anton,sans-serif;font-size:38px;line-height:.78;color:#E4007C\">16<\u002Fdiv>\n            <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.4)\">Sept<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:7px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n            <span style=\"font:700 12px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:#E4007C\">Wed<\u002Fspan>\n            <span style=\"width:22px;height:22px;border-radius:50%;background:rgba(18,16,15,.08);display:grid;place-items:center;font-size:10px;color:rgba(18,16,15,.6)\">▼<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Anton,sans-serif;font-size:27px;line-height:1.02;text-transform:uppercase\">Arrival + Lady Bee ★<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.5;color:rgba(18,16,15,.72);text-wrap:pretty\">Land off the redeye at 6:55 AM — take it easy. Check in, nap, gentle wander, then 8 PM cocktails at Lady Bee.<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:5px;font:600 10px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase\">\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">Barranco or Miraflores<\u002Fspan>\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">~20° / 15°<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsummary>\n        <div style=\"padding:0 0 24px;display:grid;gap:16px\">\n          <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.62);border-left:2px solid #E4007C;padding-left:11px\">Grey &amp; mild; coastal fog, high humidity, little sun. Light jacket, not a raincoat.<\u002Fdiv>\n          <div style=\"display:grid;gap:6px;font-size:13.5px;line-height:1.4\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Logistics<\u002Fdiv>\n            <div>Land 6:55 AM · Airport→Miraflores 30–90 min · Taxi: Green Taxi ~PEN 100.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border:2px solid #E4007C;padding:14px\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:#E4007C\">★ Reservation · 8:00 PM<\u002Fdiv>\n            <div style=\"font-family:Anton,sans-serif;font-size:22px;text-transform:uppercase;margin-top:7px\">Lady Bee<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5;margin-top:5px\">Wed Sept 16, 20:00. <a href=\"https://www.google.com/maps/search/?api=1&amp;query=Lady+Bee+Av.+Pedro+de+Osma+205+Barranco+Lima\" target=\"_blank\" rel=\"noopener\">Av. Pedro de Osma 205, Barranco<\u002Fa>. Phone <a href=\"tel:+5114383775\">+51 1 438 3775<\u002Fa>. Peru’s top-ranked cocktail bar (World’s 50 Best); small plates too — arrive a little hungry.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:12px\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Ease into it<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Malecón de Miraflores<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Miraflores<\u002Fspan><br>Clifftop boardwalk over the Pacific; paragliders, ocean air, sunset. Walk to Parque del Amor.<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Parque Kennedy / Cat Park<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Miraflores<\u002Fspan><br>Dozens of friendly resident cats, artists, food carts. Grab picarones from a cart.<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Ceviche lunch<\u002Fstrong><br>Get the classic in today so Maido stands alone tomorrow. La Mar, Canta Rana and Isolina are below.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ show_lima_ceviche }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#12100F;color:#FFFBF5;padding:16px\">\n              <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase;color:#FFC300;margin-bottom:10px\">Little black book<\u002Fdiv>\n              <div style=\"font-family:Anton,sans-serif;font-size:17px;text-transform:uppercase\">Lima — Ceviche &amp; seafood<\u002Fdiv>\n              <div style=\"font-size:12px;line-height:1.4;color:rgba(255,251,245,.55);margin-top:3px\">Ceviche is a lunch dish; go midday.<\u002Fdiv>\n              <div style=\"display:grid;gap:13px;margin-top:13px\">\n                <sc-for list=\"{{ sec_lima_ceviche }}\" as=\"it\" hint-placeholder-count=\"4\">\n                  <div style=\"font-size:14.5px;line-height:1.5\">\n                    <div><sc-if value=\"{{ it.star }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#FFC300\">★ <\u002Fspan><\u002Fsc-if><strong>{{ it.name }}<\u002Fstrong> <span style=\"color:rgba(255,251,245,.5)\">· {{ it.area }}<\u002Fspan><\u002Fdiv>\n                    <div>{{ it.note }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:3px;font-size:13px\">\n                      <sc-if value=\"{{ it.map }}\"><a href=\"{{ it.map }}\" target=\"_blank\" rel=\"noopener\">{{ it.addr }}<\u002Fa><\u002Fsc-if>\n                      <sc-if value=\"{{ it.tel }}\"><a href=\"{{ it.tel }}\">{{ it.phone }}<\u002Fa><\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ show_lima_street }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#12100F;color:#FFFBF5;padding:16px\">\n              <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase;color:#FFC300;margin-bottom:10px\">Little black book<\u002Fdiv>\n              <div style=\"font-family:Anton,sans-serif;font-size:17px;text-transform:uppercase\">Lima — Street food &amp; sandwiches<\u002Fdiv>\n              <div style=\"display:grid;gap:13px;margin-top:13px\">\n                <sc-for list=\"{{ sec_lima_street }}\" as=\"it\" hint-placeholder-count=\"4\">\n                  <div style=\"font-size:14.5px;line-height:1.5\">\n                    <div><sc-if value=\"{{ it.star }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#FFC300\">★ <\u002Fspan><\u002Fsc-if><strong>{{ it.name }}<\u002Fstrong> <span style=\"color:rgba(255,251,245,.5)\">· {{ it.area }}<\u002Fspan><\u002Fdiv>\n                    <div>{{ it.note }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:3px;font-size:13px\">\n                      <sc-if value=\"{{ it.map }}\"><a href=\"{{ it.map }}\" target=\"_blank\" rel=\"noopener\">{{ it.addr }}<\u002Fa><\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showMaps }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border:1px solid rgba(18,16,15,.14)\">\n              <iframe src=\"about:blank#b47b48c5-ef5f-457d-8855-b349e3c80475\" height=\"{{ mapHeight }}\" title=\"Lima map\"><\u002Fiframe>\n              <div style=\"padding:8px 11px;font:500 11px/1.4 'Work Sans';color:rgba(18,16,15,.55);border-top:1px solid rgba(18,16,15,.14)\">Lima — everything in this guide, Miraflores to Barranco.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-screen-label=\"Sept 17\" style=\"border-top:1px solid rgba(18,16,15,.16)\">\n        <summary style=\"cursor:pointer;padding:20px 0;display:grid;grid-template-columns:54px 1fr;gap:0 14px;align-items:start\">\n          <div style=\"display:grid;justify-items:center;gap:3px;padding-top:2px\">\n            <div style=\"font-family:Anton,sans-serif;font-size:38px;line-height:.78;color:#E4007C\">17<\u002Fdiv>\n            <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.4)\">Sept<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:7px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n            <span style=\"font:700 12px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:#E4007C\">Thu<\u002Fspan>\n            <span style=\"width:22px;height:22px;border-radius:50%;background:rgba(18,16,15,.08);display:grid;place-items:center;font-size:10px;color:rgba(18,16,15,.6)\">▼<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Anton,sans-serif;font-size:27px;line-height:1.02;text-transform:uppercase\">Lima culture + Maido ★<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.5;color:rgba(18,16,15,.72);text-wrap:pretty\">A full Lima day now you’ve recovered. Keep lunch light — tonight is Maido. Culture-heavy by day so you arrive hungry.<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:5px;font:600 10px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase\">\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">Barranco or Miraflores<\u002Fspan>\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">~20° / 15°<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsummary>\n        <div style=\"padding:0 0 24px;display:grid;gap:16px\">\n          <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.62);border-left:2px solid #E4007C;padding-left:11px\">Same soft, overcast day; comfortable for walking and museums; light layer for the evening.<\u002Fdiv>\n          <div style=\"border:2px solid #E4007C;padding:14px\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:#E4007C\">★ Reservation · evening<\u002Fdiv>\n            <div style=\"font-family:Anton,sans-serif;font-size:22px;text-transform:uppercase;margin-top:7px\">Maido<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5;margin-top:5px\"><a href=\"https://www.google.com/maps/search/?api=1&amp;query=Maido+Calle+San+Mart%C3%ADn+399+Miraflores+Lima\" target=\"_blank\" rel=\"noopener\">Calle San Martín 399, Miraflores<\u002Fa>. Nikkei tasting menu; reconfirm day before, flag dietary needs, smart-casual, arrive hungry.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:12px\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Do this by day<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><span style=\"color:#E4007C\">★ <\u002Fspan><strong>Larco Museum<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Pueblo Libre<\u002Fspan><br>World-class pre-Columbian art in a garden mansion; the single best museum in Lima. Beautiful café on site.<br><a href=\"https://www.google.com/maps/search/?api=1&amp;query=Museo+Larco+Av.+Sim%C3%B3n+Bol%C3%ADvar+1515+Pueblo+Libre+Lima\" target=\"_blank\" rel=\"noopener\">Av. Simón Bolívar 1515, Pueblo Libre, Lima<\u002Fa><\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Convento de San Francisco<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Historic Centre<\u002Fspan><br>Baroque monastery with underground catacomb ossuary and a 20,000-volume antique library. Guided entry only.<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><span style=\"color:#E4007C\">★ <\u002Fspan><strong>Barranco street-art walk<\u002Fstrong><br>Bajada de Baños, Pasaje Oroya, and the Bridge of Sighs. Lima’s open-air mural gallery. Golden hour is best.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ show_lima_art }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#12100F;color:#FFFBF5;padding:16px\">\n              <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase;color:#FFC300;margin-bottom:10px\">Little black book<\u002Fdiv>\n              <div style=\"font-family:Anton,sans-serif;font-size:17px;text-transform:uppercase\">Lima — Art &amp; street art<\u002Fdiv>\n              <div style=\"font-size:12px;line-height:1.4;color:rgba(255,251,245,.55);margin-top:3px\">Barranco is an open-air gallery.<\u002Fdiv>\n              <div style=\"display:grid;gap:13px;margin-top:13px\">\n                <sc-for list=\"{{ sec_lima_art }}\" as=\"it\" hint-placeholder-count=\"4\">\n                  <div style=\"font-size:14.5px;line-height:1.5\">\n                    <div><sc-if value=\"{{ it.star }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#FFC300\">★ <\u002Fspan><\u002Fsc-if><strong>{{ it.name }}<\u002Fstrong> <span style=\"color:rgba(255,251,245,.5)\">· {{ it.area }}<\u002Fspan><\u002Fdiv>\n                    <div>{{ it.note }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:3px;font-size:13px\">\n                      <sc-if value=\"{{ it.map }}\"><a href=\"{{ it.map }}\" target=\"_blank\" rel=\"noopener\">{{ it.addr }}<\u002Fa><\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ show_lima_history }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#12100F;color:#FFFBF5;padding:16px\">\n              <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase;color:#FFC300;margin-bottom:10px\">Little black book<\u002Fdiv>\n              <div style=\"font-family:Anton,sans-serif;font-size:17px;text-transform:uppercase\">Lima — History &amp; oddities<\u002Fdiv>\n              <div style=\"display:grid;gap:13px;margin-top:13px\">\n                <sc-for list=\"{{ sec_lima_history }}\" as=\"it\" hint-placeholder-count=\"4\">\n                  <div style=\"font-size:14.5px;line-height:1.5\">\n                    <div><sc-if value=\"{{ it.star }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#FFC300\">★ <\u002Fspan><\u002Fsc-if><strong>{{ it.name }}<\u002Fstrong> <span style=\"color:rgba(255,251,245,.5)\">· {{ it.area }}<\u002Fspan><\u002Fdiv>\n                    <div>{{ it.note }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:3px;font-size:13px\">\n                      <sc-if value=\"{{ it.map }}\"><a href=\"{{ it.map }}\" target=\"_blank\" rel=\"noopener\">{{ it.addr }}<\u002Fa><\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-screen-label=\"Sept 18\" style=\"border-top:1px solid rgba(18,16,15,.16)\">\n        <summary style=\"cursor:pointer;padding:20px 0;display:grid;grid-template-columns:54px 1fr;gap:0 14px;align-items:start\">\n          <div style=\"display:grid;justify-items:center;gap:3px;padding-top:2px\">\n            <div style=\"font-family:Anton,sans-serif;font-size:38px;line-height:.78;color:#E4007C\">18<\u002Fdiv>\n            <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.4)\">Sept<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:7px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n            <span style=\"font:700 12px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:#E4007C\">Fri · Tour day 1<\u002Fspan>\n            <span style=\"width:22px;height:22px;border-radius:50%;background:rgba(18,16,15,.08);display:grid;place-items:center;font-size:10px;color:rgba(18,16,15,.6)\">▼<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Anton,sans-serif;font-size:27px;line-height:1.02;text-transform:uppercase\">Lima — tour begins<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.5;color:rgba(18,16,15,.72);text-wrap:pretty\">Tour starts with a 2 PM welcome meeting and an easy leader-led walk downtown. You’ve already seen Lima well — today is about meeting the group.<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:5px;font:600 10px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase\">\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">Hotel, Miraflores<\u002Fspan>\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">~20° / 15°<\u002Fspan>\n            <span style=\"padding:5px 8px;background:#FFC300\">Meeting 2:00 PM<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsummary>\n        <div style=\"padding:0 0 24px;display:grid;gap:16px\">\n          <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.62);border-left:2px solid #E4007C;padding-left:11px\">Mild &amp; grey; easy walking weather.<\u002Fdiv>\n          <div style=\"display:grid;gap:6px;font-size:13.5px;line-height:1.4\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Logistics<\u002Fdiv>\n            <div>Welcome meeting 2:00 PM · at Hotel El Señorial · bring insurance + emergency contacts.<\u002Fdiv>\n            <div style=\"color:rgba(18,16,15,.6)\">Journey: Miraflores → (leader-led walk) → Downtown Lima.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#12100F;color:#FFFBF5;padding:14px;font-size:14px;line-height:1.5\">Don’t miss the 2 PM meeting — it’s where insurance &amp; emergency details are collected. Late? Tell reception.<\u002Fdiv>\n          <div style=\"display:grid;gap:12px\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">If you have the afternoon<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Huaca Pucllana<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Miraflores<\u002Fspan><br>Pre-Inca adobe pyramid rising out of the city; lit at night, restaurant on site.<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Optional group dinner<\u002Fstrong><br>Relaxed first night with fellow travellers; leader will suggest a spot.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ show_lima_skate }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#12100F;color:#FFFBF5;padding:16px\">\n              <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase;color:#FFC300;margin-bottom:10px\">Little black book<\u002Fdiv>\n              <div style=\"font-family:Anton,sans-serif;font-size:17px;text-transform:uppercase\">Lima — Skate &amp; streetwear<\u002Fdiv>\n              <div style=\"font-size:12px;line-height:1.4;color:rgba(255,251,245,.55);margin-top:3px\">For Michael; buy good gear here, Cusco is thin.<\u002Fdiv>\n              <div style=\"display:grid;gap:13px;margin-top:13px\">\n                <sc-for list=\"{{ sec_lima_skate }}\" as=\"it\" hint-placeholder-count=\"4\">\n                  <div style=\"font-size:14.5px;line-height:1.5\">\n                    <div><sc-if value=\"{{ it.star }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#FFC300\">★ <\u002Fspan><\u002Fsc-if><strong>{{ it.name }}<\u002Fstrong> <span style=\"color:rgba(255,251,245,.5)\">· {{ it.area }}<\u002Fspan><\u002Fdiv>\n                    <div>{{ it.note }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:3px;font-size:13px\">\n                      <sc-if value=\"{{ it.map }}\"><a href=\"{{ it.map }}\" target=\"_blank\" rel=\"noopener\">{{ it.addr }}<\u002Fa><\u002Fsc-if>\n                      <sc-if value=\"{{ it.tel }}\"><a href=\"{{ it.tel }}\">{{ it.phone }}<\u002Fa><\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ show_lima_drink }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#12100F;color:#FFFBF5;padding:16px\">\n              <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase;color:#FFC300;margin-bottom:10px\">Little black book<\u002Fdiv>\n              <div style=\"font-family:Anton,sans-serif;font-size:17px;text-transform:uppercase\">Lima — Drink<\u002Fdiv>\n              <div style=\"font-size:12px;line-height:1.4;color:rgba(255,251,245,.55);margin-top:3px\">Barranco is the bar district.<\u002Fdiv>\n              <div style=\"display:grid;gap:13px;margin-top:13px\">\n                <sc-for list=\"{{ sec_lima_drink }}\" as=\"it\" hint-placeholder-count=\"4\">\n                  <div style=\"font-size:14.5px;line-height:1.5\">\n                    <div><sc-if value=\"{{ it.star }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#FFC300\">★ <\u002Fspan><\u002Fsc-if><strong>{{ it.name }}<\u002Fstrong> <span style=\"color:rgba(255,251,245,.5)\">· {{ it.area }}<\u002Fspan><\u002Fdiv>\n                    <div>{{ it.note }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:3px;font-size:13px\">\n                      <sc-if value=\"{{ it.map }}\"><a href=\"{{ it.map }}\" target=\"_blank\" rel=\"noopener\">{{ it.addr }}<\u002Fa><\u002Fsc-if>\n                      <sc-if value=\"{{ it.tel }}\"><a href=\"{{ it.tel }}\">{{ it.phone }}<\u002Fa><\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <div style=\"background:#E4007C;color:#FFFBF5;padding:15px 16px;margin-top:22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n        <span style=\"font-family:Anton,sans-serif;font-size:23px;line-height:1;text-transform:uppercase\">Cusco &amp; the Sacred Valley<\u002Fspan>\n        <span style=\"font:700 10px/1.3 'Work Sans';letter-spacing:.14em;text-transform:uppercase;color:#FFFBF5\">Sept 19–22 · 3,450 m<\u002Fspan>\n      <\u002Fdiv>\n      <details data-screen-label=\"Sept 19\" style=\"border-top:1px solid rgba(18,16,15,.16)\">\n        <summary style=\"cursor:pointer;padding:20px 0;display:grid;grid-template-columns:54px 1fr;gap:0 14px;align-items:start\">\n          <div style=\"display:grid;justify-items:center;gap:3px;padding-top:2px\">\n            <div style=\"font-family:Anton,sans-serif;font-size:38px;line-height:.78;color:#E4007C\">19<\u002Fdiv>\n            <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.4)\">Sept<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:7px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n            <span style=\"font:700 12px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:#E4007C\">Sat · Tour day 2<\u002Fspan>\n            <span style=\"width:22px;height:22px;border-radius:50%;background:rgba(18,16,15,.08);display:grid;place-items:center;font-size:10px;color:rgba(18,16,15,.6)\">▼<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Anton,sans-serif;font-size:27px;line-height:1.02;text-transform:uppercase\">Fly to Cusco<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.5;color:rgba(18,16,15,.72);text-wrap:pretty\">Early flight to Cusco (5:30 AM hotel departure). Main job is acclimatising — go slow, coca tea, skip alcohol. Gentle orientation walk introduces the old town.<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:5px;font:600 10px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase\">\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">Hotel, Cusco<\u002Fspan>\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">~21° / 4°<\u002Fspan>\n            <span style=\"padding:5px 8px;background:#E4007C;color:#FFFBF5\">3,450 m — go slow<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsummary>\n        <div style=\"padding:0 0 24px;display:grid;gap:16px\">\n          <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.62);border-left:2px solid #E4007C;padding-left:11px\">The big swing begins — warm sunny afternoons, ~4°C nights. Extreme UV: hat + sunscreen by day, warm layer at night.<\u002Fdiv>\n          <div style=\"display:grid;gap:6px;font-size:13.5px;line-height:1.4\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Logistics<\u002Fdiv>\n            <div>Depart hotel 5:30 AM · flight ~1h 20m · altitude 3,450 m · take it SLOW.<\u002Fdiv>\n            <div style=\"color:rgba(18,16,15,.6)\">Journey: Lima → (early flight) → Cusco.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:12px\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Orientation-walk highlights<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Qorikancha<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Av. El Sol<\u002Fspan><br>Inca Sun Temple with a Spanish church on top; finest stonework in Cusco.<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Plaza de Armas &amp; San Blas<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Old Town<\u002Fspan><br>Grand main square, then the steep artisan quarter with the best city views.<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>San Pedro Market<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Central Cusco<\u002Fspan><br>Juices, cheeses, chocolate, caldo de gallina; the essential local market.<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ show_cusco_eat }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#12100F;color:#FFFBF5;padding:16px\">\n              <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase;color:#FFC300;margin-bottom:10px\">Little black book<\u002Fdiv>\n              <div style=\"font-family:Anton,sans-serif;font-size:17px;text-transform:uppercase\">Cusco — Eat &amp; drink<\u002Fdiv>\n              <div style=\"font-size:12px;line-height:1.4;color:rgba(255,251,245,.55);margin-top:3px\">Picanterías for the real thing; San Blas for cafés.<\u002Fdiv>\n              <div style=\"display:grid;gap:13px;margin-top:13px\">\n                <sc-for list=\"{{ sec_cusco_eat }}\" as=\"it\" hint-placeholder-count=\"4\">\n                  <div style=\"font-size:14.5px;line-height:1.5\">\n                    <div><sc-if value=\"{{ it.star }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#FFC300\">★ <\u002Fspan><\u002Fsc-if><strong>{{ it.name }}<\u002Fstrong> <span style=\"color:rgba(255,251,245,.5)\">· {{ it.area }}<\u002Fspan><\u002Fdiv>\n                    <div>{{ it.note }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:3px;font-size:13px\">\n                      <sc-if value=\"{{ it.map }}\"><a href=\"{{ it.map }}\" target=\"_blank\" rel=\"noopener\">{{ it.addr }}<\u002Fa><\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ show_cusco_art }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#12100F;color:#FFFBF5;padding:16px\">\n              <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase;color:#FFC300;margin-bottom:10px\">Little black book<\u002Fdiv>\n              <div style=\"font-family:Anton,sans-serif;font-size:17px;text-transform:uppercase\">Cusco — Art, history &amp; skate<\u002Fdiv>\n              <div style=\"display:grid;gap:13px;margin-top:13px\">\n                <sc-for list=\"{{ sec_cusco_art }}\" as=\"it\" hint-placeholder-count=\"4\">\n                  <div style=\"font-size:14.5px;line-height:1.5\">\n                    <div><sc-if value=\"{{ it.star }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#FFC300\">★ <\u002Fspan><\u002Fsc-if><strong>{{ it.name }}<\u002Fstrong> <span style=\"color:rgba(255,251,245,.5)\">· {{ it.area }}<\u002Fspan><\u002Fdiv>\n                    <div>{{ it.note }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:3px;font-size:13px\">\n                      <sc-if value=\"{{ it.map }}\"><a href=\"{{ it.map }}\" target=\"_blank\" rel=\"noopener\">{{ it.addr }}<\u002Fa><\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showMaps }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border:1px solid rgba(18,16,15,.14)\">\n              <iframe src=\"about:blank#b47b48c5-ef5f-457d-8855-b349e3c80475\" height=\"{{ mapHeight }}\" title=\"Cusco map\"><\u002Fiframe>\n              <div style=\"padding:8px 11px;font:500 11px/1.4 'Work Sans';color:rgba(18,16,15,.55);border-top:1px solid rgba(18,16,15,.14)\">Cusco old town — everything is walkable, but slowly at 3,450 m.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-screen-label=\"Sept 20\" style=\"border-top:1px solid rgba(18,16,15,.16)\">\n        <summary style=\"cursor:pointer;padding:20px 0;display:grid;grid-template-columns:54px 1fr;gap:0 14px;align-items:start\">\n          <div style=\"display:grid;justify-items:center;gap:3px;padding-top:2px\">\n            <div style=\"font-family:Anton,sans-serif;font-size:38px;line-height:.78;color:#E4007C\">20<\u002Fdiv>\n            <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.4)\">Sept<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:7px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n            <span style=\"font:700 12px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:#E4007C\">Sun · Tour day 3<\u002Fspan>\n            <span style=\"width:22px;height:22px;border-radius:50%;background:rgba(18,16,15,.08);display:grid;place-items:center;font-size:10px;color:rgba(18,16,15,.6)\">▼<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Anton,sans-serif;font-size:27px;line-height:1.02;text-transform:uppercase\">Sacred Valley → Aguas Calientes<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.5;color:rgba(18,16,15,.72);text-wrap:pretty\">Scenic run through the Sacred Valley with a community visit &amp; lunch, then the train from Ollantaytambo to Aguas Calientes at the foot of Machu Picchu.<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:5px;font:600 10px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase\">\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">Aguas Calientes<\u002Fspan>\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">~18° / 6°<\u002Fspan>\n            <span style=\"padding:5px 8px;background:#FFC300\">Daypack only<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsummary>\n        <div style=\"padding:0 0 24px;display:grid;gap:16px\">\n          <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.62);border-left:2px solid #E4007C;padding-left:11px\">Milder valley day; dropping into cloud forest, humidity rises — keep a rain layer handy.<\u002Fdiv>\n          <div style=\"display:grid;gap:6px;font-size:13.5px;line-height:1.4\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Logistics<\u002Fdiv>\n            <div>Travel ~3 hrs + train · included community lunch · sit on the left side of the train.<\u002Fdiv>\n            <div style=\"color:rgba(18,16,15,.6)\">Journey: Cusco → Sacred Valley → (train) → Aguas Calientes.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:12px\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Along the way / that evening<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Maras Salt Mines<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Sacred Valley<\u002Fspan><br>Thousands of terraced salt pools worked since pre-Inca times; very photogenic. Buy salt &amp; salt-chocolate.<br><a href=\"https://www.google.com/maps/search/?api=1&amp;query=Salineras+de+Maras+Peru\" target=\"_blank\" rel=\"noopener\">Salineras de Maras<\u002Fa><\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Ollantaytambo<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Sacred Valley<\u002Fspan><br>Living Inca town with a monumental fortress-temple and still-flowing Inca waterworks.<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><span style=\"color:#E4007C\">★ <\u002Fspan><strong>Indio Feliz<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Aguas Calientes<\u002Fspan><br>The town’s most-loved restaurant; quirky French-Peruvian; perfect post-arrival dinner.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#12100F;color:#FFFBF5;padding:14px;font-size:14px;line-height:1.5\">Today is the annual Warachicuy Inca reenactment at Sacsayhuamán in Cusco — you’ll be in the valley, so you’ll miss it, but locals may mention it.<\u002Fdiv>\n          <sc-if value=\"{{ show_valley }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#12100F;color:#FFFBF5;padding:16px\">\n              <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase;color:#FFC300;margin-bottom:10px\">Little black book<\u002Fdiv>\n              <div style=\"font-family:Anton,sans-serif;font-size:17px;text-transform:uppercase\">Sacred Valley<\u002Fdiv>\n              <div style=\"display:grid;gap:13px;margin-top:13px\">\n                <sc-for list=\"{{ sec_valley }}\" as=\"it\" hint-placeholder-count=\"4\">\n                  <div style=\"font-size:14.5px;line-height:1.5\">\n                    <div><sc-if value=\"{{ it.star }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#FFC300\">★ <\u002Fspan><\u002Fsc-if><strong>{{ it.name }}<\u002Fstrong> <span style=\"color:rgba(255,251,245,.5)\">· {{ it.area }}<\u002Fspan><\u002Fdiv>\n                    <div>{{ it.note }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ show_aguas }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#12100F;color:#FFFBF5;padding:16px\">\n              <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase;color:#FFC300;margin-bottom:10px\">Little black book<\u002Fdiv>\n              <div style=\"font-family:Anton,sans-serif;font-size:17px;text-transform:uppercase\">Aguas Calientes<\u002Fdiv>\n              <div style=\"font-size:12px;line-height:1.4;color:rgba(255,251,245,.55);margin-top:3px\">Machu Picchu base town; food costs more — it all arrives by train.<\u002Fdiv>\n              <div style=\"display:grid;gap:13px;margin-top:13px\">\n                <sc-for list=\"{{ sec_aguas }}\" as=\"it\" hint-placeholder-count=\"3\">\n                  <div style=\"font-size:14.5px;line-height:1.5\">\n                    <div><sc-if value=\"{{ it.star }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#FFC300\">★ <\u002Fspan><\u002Fsc-if><strong>{{ it.name }}<\u002Fstrong> <span style=\"color:rgba(255,251,245,.5)\">· {{ it.area }}<\u002Fspan><\u002Fdiv>\n                    <div>{{ it.note }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showMaps }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border:1px solid rgba(18,16,15,.14)\">\n              <iframe src=\"about:blank#b47b48c5-ef5f-457d-8855-b349e3c80475\" height=\"{{ mapHeight }}\" title=\"Sacred Valley map\"><\u002Fiframe>\n              <div style=\"padding:8px 11px;font:500 11px/1.4 'Work Sans';color:rgba(18,16,15,.55);border-top:1px solid rgba(18,16,15,.14)\">Sacred Valley and the run down to Machu Picchu.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-screen-label=\"Sept 21\" style=\"border-top:1px solid rgba(18,16,15,.16)\">\n        <summary style=\"cursor:pointer;padding:20px 0;display:grid;grid-template-columns:54px 1fr;gap:0 14px;align-items:start\">\n          <div style=\"display:grid;justify-items:center;gap:3px;padding-top:2px\">\n            <div style=\"font-family:Anton,sans-serif;font-size:38px;line-height:.78;color:#E4007C\">21<\u002Fdiv>\n            <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.4)\">Sept<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:7px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n            <span style=\"font:700 12px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:#E4007C\">Mon · Tour day 4<\u002Fspan>\n            <span style=\"width:22px;height:22px;border-radius:50%;background:rgba(18,16,15,.08);display:grid;place-items:center;font-size:10px;color:rgba(18,16,15,.6)\">▼<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Anton,sans-serif;font-size:27px;line-height:1.02;text-transform:uppercase\">Machu Picchu ★, back to Cusco<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.5;color:rgba(18,16,15,.72);text-wrap:pretty\">Early bus up the switchbacks for a guided tour of one of the Seven Wonders of the World, then train &amp; drive back to Cusco.<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:5px;font:600 10px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase\">\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">Hotel, Cusco<\u002Fspan>\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">~15° / 5°<\u002Fspan>\n            <span style=\"padding:5px 8px;background:#FFC300\">Passport checked<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsummary>\n        <div style=\"padding:0 0 24px;display:grid;gap:16px\">\n          <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.62);border-left:2px solid #E4007C;padding-left:11px\">Cloud forest; highest shower chance of the trip; misty mornings often clear. Layers + rain shell.<\u002Fdiv>\n          <div style=\"display:grid;gap:6px;font-size:13.5px;line-height:1.4\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Logistics<\u002Fdiv>\n            <div>First bus 6:00 AM · bring passport (checked) · also water, bug spray, rain layer.<\u002Fdiv>\n            <div style=\"color:rgba(18,16,15,.6)\">Journey: Aguas Calientes → (bus up) → Machu Picchu → Cusco.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#12100F;color:#FFFBF5;padding:14px;font-size:14px;line-height:1.5\">Site opens after sunrise (no sunrise visit); once the guided tour ends you must exit. Wayna Picchu needs a separate permit booked months ahead — Intrepid leaders can’t help arrange it, so sort it yourself early if you want the climb.<\u002Fdiv>\n          <div style=\"display:grid;gap:12px\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Back in Cusco tonight<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Cicciolina<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Centre, 2nd floor<\u002Fspan><br>Long-loved creative Andean-Mediterranean cooking; a great celebratory dinner.<br><a href=\"https://www.google.com/maps/search/?api=1&amp;query=Cicciolina+Calle+Triunfo+393+Cusco\" target=\"_blank\" rel=\"noopener\">Calle Triunfo 393, Cusco<\u002Fa><\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Museo del Pisco<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Central Cusco<\u002Fspan><br>Pisco bar with tastings &amp; live music; a fun, low-key night.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-screen-label=\"Sept 22\" style=\"border-top:1px solid rgba(18,16,15,.16)\">\n        <summary style=\"cursor:pointer;padding:20px 0;display:grid;grid-template-columns:54px 1fr;gap:0 14px;align-items:start\">\n          <div style=\"display:grid;justify-items:center;gap:3px;padding-top:2px\">\n            <div style=\"font-family:Anton,sans-serif;font-size:38px;line-height:.78;color:#E4007C\">22<\u002Fdiv>\n            <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.4)\">Sept<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:7px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n            <span style=\"font:700 12px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:#E4007C\">Tue · Tour day 5<\u002Fspan>\n            <span style=\"width:22px;height:22px;border-radius:50%;background:rgba(18,16,15,.08);display:grid;place-items:center;font-size:10px;color:rgba(18,16,15,.6)\">▼<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Anton,sans-serif;font-size:27px;line-height:1.02;text-transform:uppercase\">Free day in Cusco<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.5;color:rgba(18,16,15,.72);text-wrap:pretty\">Your one truly flexible day. Big-adventure option (Rainbow Mountain, Humantay) or a relaxed art-market-and-café crawl through San Blas — a lighter day here is smart before Titicaca.<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:5px;font:600 10px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase\">\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">Hotel, Cusco<\u002Fspan>\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">~21° / 4°<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsummary>\n        <div style=\"padding:0 0 24px;display:grid;gap:16px\">\n          <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.62);border-left:2px solid #E4007C;padding-left:11px\">Classic Cusco; bright sunny ~21°C, cold once the sun dips. Great for a high hike — start early, layer up.<\u002Fdiv>\n          <div style=\"display:grid;gap:12px\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Active options<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Palcoyo Rainbow Mountain<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· day trip, ~USD 100<\u002Fspan><br>Quieter, easier alternative to Vinicunca; three rainbow ridges, less crowd. Long day at altitude.<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Humantay Lake<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· day trip, ~USD 130<\u002Fspan><br>Turquoise glacial lake below a snow peak; gorgeous, a real leg-burner.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:12px\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Relaxed option — San Blas<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><span style=\"color:#E4007C\">★ <\u002Fspan><strong>San Blas artisan quarter<\u002Fstrong><br>Cobbled galleries &amp; workshops; Casa Mérida ceramics, Mendívil figures, the 7 Angelitos alley.<br><a href=\"https://www.google.com/maps/search/?api=1&amp;query=Plazoleta+San+Blas+Cusco\" target=\"_blank\" rel=\"noopener\">Plazoleta San Blas, Cusco<\u002Fa><\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>ChocoMuseo<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Plaza Regocijo 216<\u002Fspan><br>Bean-to-bar chocolate workshops and a pisco/coffee/chocolate tasting; fun and hands-on.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <div style=\"background:#12100F;color:#FFFBF5;padding:15px 16px;margin-top:22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n        <span style=\"font-family:Anton,sans-serif;font-size:23px;line-height:1;text-transform:uppercase\">Lake Titicaca<\u002Fspan>\n        <span style=\"font:700 10px/1.3
