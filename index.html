 'Work Sans';letter-spacing:.14em;text-transform:uppercase;color:#FFC300\">Sept 23–24 · 3,800 m<\u002Fspan>\n      <\u002Fdiv>\n      <details data-screen-label=\"Sept 23\" style=\"border-top:1px solid rgba(18,16,15,.16)\">\n        <summary style=\"cursor:pointer;padding:20px 0;display:grid;grid-template-columns:54px 1fr;gap:0 14px;align-items:start\">\n          <div style=\"display:grid;justify-items:center;gap:3px;padding-top:2px\">\n            <div style=\"font-family:Anton,sans-serif;font-size:38px;line-height:.78;color:#E4007C\">23<\u002Fdiv>\n            <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.4)\">Sept<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:7px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n            <span style=\"font:700 12px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:#E4007C\">Wed · Tour day 6<\u002Fspan>\n            <span style=\"width:22px;height:22px;border-radius:50%;background:rgba(18,16,15,.08);display:grid;place-items:center;font-size:10px;color:rgba(18,16,15,.6)\">▼<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Anton,sans-serif;font-size:27px;line-height:1.02;text-transform:uppercase\">Drive to Puno<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.5;color:rgba(18,16,15,.72);text-wrap:pretty\">Long, scenic drive (~7.5 hrs) across the high Altiplano to Puno on Lake Titicaca. The landscape — endless plains, alpaca herds — is the attraction.<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:5px;font:600 10px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase\">\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">Hotel, Puno<\u002Fspan>\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">~16° / −1°<\u002Fspan>\n            <span style=\"padding:5px 8px;background:#E4007C;color:#FFFBF5\">3,800 m<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsummary>\n        <div style=\"padding:0 0 24px;display:grid;gap:16px\">\n          <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.62);border-left:2px solid #E4007C;padding-left:11px\">Higher &amp; colder; sunny dry days, nights near/below freezing. Dry air makes the sun feel fierce and the cold bite hard.<\u002Fdiv>\n          <div style=\"display:grid;gap:6px;font-size:13.5px;line-height:1.4\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Logistics<\u002Fdiv>\n            <div>Drive ~7.5 hrs · altitude 3,800 m · try tonight: grilled trout (trucha).<\u002Fdiv>\n            <div style=\"color:rgba(18,16,15,.6)\">Journey: Cusco → (Altiplano drive) → Puno.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:12px\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">In Puno<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Jirón Lima<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Puno centre<\u002Fspan><br>The pedestrian spine; alpaca-wool shops, cafés, trout restaurants; best stroll in town.<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Kuntur Wasi / Condor Hill<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Puno<\u002Fspan><br>Steep climb to a giant condor statue and the best view over the lake; sunset if you have energy.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#12100F;color:#FFFBF5;padding:14px;font-size:14px;line-height:1.5\">Intrepid flags occasional political unrest around Puno — the leader will adjust transport if needed.<\u002Fdiv>\n          <sc-if value=\"{{ show_puno }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#12100F;color:#FFFBF5;padding:16px\">\n              <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase;color:#FFC300;margin-bottom:10px\">Little black book<\u002Fdiv>\n              <div style=\"font-family:Anton,sans-serif;font-size:17px;text-transform:uppercase\">Puno &amp; Lake Titicaca<\u002Fdiv>\n              <div style=\"display:grid;gap:13px;margin-top:13px\">\n                <sc-for list=\"{{ sec_puno }}\" as=\"it\" hint-placeholder-count=\"4\">\n                  <div style=\"font-size:14.5px;line-height:1.5\">\n                    <div><sc-if value=\"{{ it.star }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#FFC300\">★ <\u002Fspan><\u002Fsc-if><strong>{{ it.name }}<\u002Fstrong> <span style=\"color:rgba(255,251,245,.5)\">· {{ it.area }}<\u002Fspan><\u002Fdiv>\n                    <div>{{ it.note }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ showMaps }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border:1px solid rgba(18,16,15,.14)\">\n              <iframe src=\"about:blank#b47b48c5-ef5f-457d-8855-b349e3c80475\" height=\"{{ mapHeight }}\" title=\"Puno and Lake Titicaca map\"><\u002Fiframe>\n              <div style=\"padding:8px 11px;font:500 11px/1.4 'Work Sans';color:rgba(18,16,15,.55);border-top:1px solid rgba(18,16,15,.14)\">Puno, the islands, and Juliaca for the flight out.<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-screen-label=\"Sept 24\" style=\"border-top:1px solid rgba(18,16,15,.16)\">\n        <summary style=\"cursor:pointer;padding:20px 0;display:grid;grid-template-columns:54px 1fr;gap:0 14px;align-items:start\">\n          <div style=\"display:grid;justify-items:center;gap:3px;padding-top:2px\">\n            <div style=\"font-family:Anton,sans-serif;font-size:38px;line-height:.78;color:#E4007C\">24<\u002Fdiv>\n            <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.4)\">Sept<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:7px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n            <span style=\"font:700 12px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:#E4007C\">Thu · Tour day 7<\u002Fspan>\n            <span style=\"width:22px;height:22px;border-radius:50%;background:rgba(18,16,15,.08);display:grid;place-items:center;font-size:10px;color:rgba(18,16,15,.6)\">▼<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Anton,sans-serif;font-size:27px;line-height:1.02;text-transform:uppercase\">Lake Titicaca &amp; homestay ★<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.5;color:rgba(18,16,15,.72);text-wrap:pretty\">Motorboat across the world’s highest navigable lake to the Uros floating reed islands, then a homestay with a local family — consistently a trip highlight.<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:5px;font:600 10px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase\">\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">Homestay<\u002Fspan>\n            <span style=\"padding:5px 8px;background:#E4007C;color:#FFFBF5\">Coldest night: ~0 to −1°<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsummary>\n        <div style=\"padding:0 0 24px;display:grid;gap:16px\">\n          <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.62);border-left:2px solid #E4007C;padding-left:11px\">Your coldest night — ~0 to −1°C, no heating (blankets provided). Bright &amp; sunny on the water; thermals + fleece after dark.<\u002Fdiv>\n          <div style=\"display:grid;gap:6px;font-size:13.5px;line-height:1.4\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Logistics<\u002Fdiv>\n            <div>Uros islands by motorboat · tonight: family homestay · facilities basic, drop toilets, no showers.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:12px\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Make the most of it<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><span style=\"color:#E4007C\">★ <\u002Fspan><strong>Uros Floating Islands<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Lake Titicaca<\u002Fspan><br>Islands hand-built from totora reeds; one of the most surreal places on the trip.<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Your homestay<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Lake Titicaca<\u002Fspan><br>Lean in: help cook, try Quechua, join the soccer game. Bring small gifts (fruit from Puno market, school supplies).<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <div style=\"background:#E4007C;color:#FFFBF5;padding:15px 16px;margin-top:22px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap\">\n        <span style=\"font-family:Anton,sans-serif;font-size:23px;line-height:1;text-transform:uppercase\">Back to Lima<\u002Fspan>\n        <span style=\"font:700 10px/1.3 'Work Sans';letter-spacing:.14em;text-transform:uppercase;color:#FFFBF5\">Sept 25–26 · sea level<\u002Fspan>\n      <\u002Fdiv>\n      <details data-screen-label=\"Sept 25\" style=\"border-top:1px solid rgba(18,16,15,.16)\">\n        <summary style=\"cursor:pointer;padding:20px 0;display:grid;grid-template-columns:54px 1fr;gap:0 14px;align-items:start\">\n          <div style=\"display:grid;justify-items:center;gap:3px;padding-top:2px\">\n            <div style=\"font-family:Anton,sans-serif;font-size:38px;line-height:.78;color:#E4007C\">25<\u002Fdiv>\n            <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.4)\">Sept<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:7px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n            <span style=\"font:700 12px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:#E4007C\">Fri · Tour day 8<\u002Fspan>\n            <span style=\"width:22px;height:22px;border-radius:50%;background:rgba(18,16,15,.08);display:grid;place-items:center;font-size:10px;color:rgba(18,16,15,.6)\">▼<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Anton,sans-serif;font-size:27px;line-height:1.02;text-transform:uppercase\">Fly back to Lima<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.5;color:rgba(18,16,15,.72);text-wrap:pretty\">Bus to Juliaca, flight to Lima, free final evening. A great chance for one more special meal — keep it in Barranco.<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:5px;font:600 10px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase\">\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">Hotel, Lima<\u002Fspan>\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">~20° / 15°<\u002Fspan>\n            <span style=\"padding:5px 8px;background:#FFC300\">Evening free<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsummary>\n        <div style=\"padding:0 0 24px;display:grid;gap:16px\">\n          <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.62);border-left:2px solid #E4007C;padding-left:11px\">Back to mild &amp; grey in Lima; perfect for a last easy evening in Miraflores or Barranco.<\u002Fdiv>\n          <div style=\"display:grid;gap:6px;font-size:13.5px;line-height:1.4\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Logistics<\u002Fdiv>\n            <div>Travel ~half day · evening free.<\u002Fdiv>\n            <div style=\"color:rgba(18,16,15,.6)\">Journey: Titicaca → (Juliaca flight) → Lima.<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:12px\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Farewell-dinner ideas — Barranco<\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><span style=\"color:#E4007C\">★ <\u002Fspan><strong>Isolina<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· Barranco<\u002Fspan><br>José del Castillo’s nostalgic Limeño tavern; huge sharing plates; on Latin America’s 50 Best. Reserve.<br><a href=\"https://www.google.com/maps/search/?api=1&amp;query=Isolina+Av.+San+Mart%C3%ADn+101+Barranco+Lima\" target=\"_blank\" rel=\"noopener\">Av. San Martín 101, Barranco, Lima<\u002Fa><\u002Fdiv>\n            <div style=\"font-size:14.5px;line-height:1.5\"><strong>Mayo<\u002Fstrong> <span style=\"color:rgba(18,16,15,.5)\">· at Central’s Casa Túpac<\u002Fspan><br>Central’s cocktail bar; a stylish nightcap.<br><a href=\"https://www.google.com/maps/search/?api=1&amp;query=Mayo+Bar+Av.+Pedro+de+Osma+301+Barranco+Lima\" target=\"_blank\" rel=\"noopener\">Av. Pedro de Osma 301, Barranco<\u002Fa><\u002Fdiv>\n          <\u002Fdiv>\n          <sc-if value=\"{{ show_lima_special }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"background:#12100F;color:#FFFBF5;padding:16px\">\n              <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.18em;text-transform:uppercase;color:#FFC300;margin-bottom:10px\">Little black book<\u002Fdiv>\n              <div style=\"font-family:Anton,sans-serif;font-size:17px;text-transform:uppercase\">Lima — Special meals<\u002Fdiv>\n              <div style=\"font-size:12px;line-height:1.4;color:rgba(255,251,245,.55);margin-top:3px\">Beyond Maido &amp; Central.<\u002Fdiv>\n              <div style=\"display:grid;gap:13px;margin-top:13px\">\n                <sc-for list=\"{{ sec_lima_special }}\" as=\"it\" hint-placeholder-count=\"2\">\n                  <div style=\"font-size:14.5px;line-height:1.5\">\n                    <div><sc-if value=\"{{ it.star }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"color:#FFC300\">★ <\u002Fspan><\u002Fsc-if><strong>{{ it.name }}<\u002Fstrong> <span style=\"color:rgba(255,251,245,.5)\">· {{ it.area }}<\u002Fspan><\u002Fdiv>\n                    <div>{{ it.note }}<\u002Fdiv>\n                    <div style=\"display:flex;flex-wrap:wrap;gap:10px;margin-top:3px;font-size:13px\">\n                      <sc-if value=\"{{ it.map }}\"><a href=\"{{ it.map }}\" target=\"_blank\" rel=\"noopener\">{{ it.addr }}<\u002Fa><\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n      <details data-screen-label=\"Sept 26\" style=\"border-top:1px solid rgba(18,16,15,.16);border-bottom:1px solid rgba(18,16,15,.16)\">\n        <summary style=\"cursor:pointer;padding:20px 0;display:grid;grid-template-columns:54px 1fr;gap:0 14px;align-items:start\">\n          <div style=\"display:grid;justify-items:center;gap:3px;padding-top:2px\">\n            <div style=\"font-family:Anton,sans-serif;font-size:38px;line-height:.78;color:#E4007C\">26<\u002Fdiv>\n            <div style=\"font:700 9px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.4)\">Sept<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:7px\">\n          <div style=\"display:flex;justify-content:space-between;align-items:center;gap:10px\">\n            <span style=\"font:700 12px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:#E4007C\">Sat · Tour day 9<\u002Fspan>\n            <span style=\"width:22px;height:22px;border-radius:50%;background:rgba(18,16,15,.08);display:grid;place-items:center;font-size:10px;color:rgba(18,16,15,.6)\">▼<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"font-family:Anton,sans-serif;font-size:27px;line-height:1.02;text-transform:uppercase\">Depart Lima<\u002Fdiv>\n          <div style=\"font-size:14.5px;line-height:1.5;color:rgba(18,16,15,.72);text-wrap:pretty\">Flight home departs 8:25 AM — really a travel morning. Arrange an airport transfer the night before.<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:5px;font:600 10px/1 'Work Sans';letter-spacing:.1em;text-transform:uppercase\">\n            <span style=\"padding:5px 8px;background:rgba(18,16,15,.07)\">~20° / 15°<\u002Fspan>\n            <span style=\"padding:5px 8px;background:#FFC300\">Flight 8:25 AM<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <\u002Fsummary>\n        <div style=\"padding:0 0 24px;display:grid;gap:16px\">\n          <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.62);border-left:2px solid #E4007C;padding-left:11px\">One last grey Lima morning; an early travel day.<\u002Fdiv>\n          <div style=\"display:grid;gap:6px;font-size:13.5px;line-height:1.4\">\n            <div style=\"font:700 10px/1 'Work Sans';letter-spacing:.16em;text-transform:uppercase;color:rgba(18,16,15,.45)\">Logistics<\u002Fdiv>\n            <div>Flight 8:25 AM · arrive YUL 5:45 PM.<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdetails>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"packing\" style=\"padding:34px 22px 6px\">\n    <div style=\"font-family:Anton,sans-serif;font-size:44px;line-height:.78;color:transparent;-webkit-text-stroke:1.5px #E4007C\">04<\u002Fdiv>\n    <div style=\"font-family:Anton,sans-serif;font-size:34px;line-height:1;text-transform:uppercase;margin:8px 0 10px\">Packing<\u002Fdiv>\n    <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.6);max-width:40ch\">Tuned to this trip: sea level to 3,800 m, cold nights, rustic homestay, early Machu Picchu.<\u002Fdiv>\n    <div style=\"display:grid;gap:14px;margin-top:18px\">\n      <div style=\"border-top:2px solid #12100F;padding-top:12px\">\n        <div style=\"font-family:Anton,sans-serif;font-size:19px;text-transform:uppercase\">Layers &amp; clothing<\u002Fdiv>\n        <div style=\"display:grid;gap:5px;margin-top:8px;font-size:14.5px;line-height:1.45\">\n          <div>Thin thermals (top &amp; bottom)<\u002Fdiv>\n          <div>Fleece or light down mid-layer<\u002Fdiv>\n          <div>Waterproof / windproof shell<\u002Fdiv>\n          <div>Broken-in walking shoes<\u002Fdiv>\n          <div>Warm hat, gloves, buff; sun hat &amp; sunglasses<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #12100F;padding-top:12px\">\n        <div style=\"font-family:Anton,sans-serif;font-size:19px;text-transform:uppercase\">Altitude &amp; sun<\u002Fdiv>\n        <div style=\"display:grid;gap:5px;margin-top:8px;font-size:14.5px;line-height:1.45\">\n          <div>Altitude meds (ask your doctor)<\u002Fdiv>\n          <div>Reusable water bottle<\u002Fdiv>\n          <div>High-SPF sunscreen &amp; lip balm<\u002Fdiv>\n          <div>Insect repellent (Machu Picchu)<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #E4007C;padding-top:12px\">\n        <div style=\"font-family:Anton,sans-serif;font-size:19px;text-transform:uppercase;color:#E4007C\">Daypack<\u002Fdiv>\n        <div style=\"font-size:12px;line-height:1.4;color:rgba(18,16,15,.55);margin-top:2px\">Main bags left behind in Cusco and Puno.<\u002Fdiv>\n        <div style=\"display:grid;gap:5px;margin-top:8px;font-size:14.5px;line-height:1.45\">\n          <div>Small overnight bag for Aguas Calientes &amp; homestay<\u002Fdiv>\n          <div>2 nights of clothes + toiletries + quick-dry towel<\u002Fdiv>\n          <div>Headlamp; extra layers for the cold homestay<\u002Fdiv>\n          <div>Small gifts for the homestay family<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border-top:2px solid #12100F;padding-top:12px\">\n        <div style=\"font-family:Anton,sans-serif;font-size:19px;text-transform:uppercase\">Don’t forget<\u002Fdiv>\n        <div style=\"display:grid;gap:5px;margin-top:8px;font-size:14.5px;line-height:1.45\">\n          <div>Passport (checked at Machu Picchu)<\u002Fdiv>\n          <div>Printed tour &amp; flight confirmations<\u002Fdiv>\n          <div>Cash in soles (PEN)<\u002Fdiv>\n          <div>Power bank &amp; plug adapter (type A/C)<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div id=\"book\" style=\"padding:34px 22px 40px\">\n    <div style=\"font-family:Anton,sans-serif;font-size:44px;line-height:.78;color:transparent;-webkit-text-stroke:1.5px #E4007C\">05<\u002Fdiv>\n    <div style=\"font-family:Anton,sans-serif;font-size:34px;line-height:1;text-transform:uppercase;margin:8px 0 10px\">Book ahead / verify<\u002Fdiv>\n    <div style=\"font-size:13px;line-height:1.5;color:rgba(18,16,15,.6);max-width:40ch\">Tap to tick off — saved on this device. Lady Bee &amp; Maido are already booked.<\u002Fdiv>\n    <div style=\"display:grid;gap:1px;background:rgba(18,16,15,.14);border:1px solid rgba(18,16,15,.14);margin-top:16px\">\n      <sc-for list=\"{{ todos }}\" as=\"t\" hint-placeholder-count=\"7\">\n        <div sc-camel-on-click=\"{{ t.toggle }}\" style=\"{{ t.style }}\">\n          <span style=\"{{ t.box }}\">{{ t.mark }}<\u002Fspan>\n          <span style=\"{{ t.text }}\">{{ t.label }}<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"margin-top:28px;background:#E4007C;color:#FFFBF5;padding:20px\">\n      <div style=\"font-family:Anton,sans-serif;font-size:23px;line-height:1.05;text-transform:uppercase\">Have the best trip<\u002Fdiv>\n      <div style=\"font-size:14px;line-height:1.5;margin-top:8px\">Eleven days, four altitudes, one very cold night on a reed island. Michael &amp; Laura, Sept 2026.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:520},&quot;showMaps&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;lens&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;all&quot;,&quot;food&quot;,&quot;skate&quot;],&quot;default&quot;:&quot;all&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Content&quot;},&quot;mapHeight&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:240,&quot;min&quot;:160,&quot;max&quot;:420,&quot;step&quot;:20,&quot;unit&quot;:&quot;px&quot;,&quot;tsType&quot;:&quot;number&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  state = { lens: null, done: {} };\n\n  componentDidMount() {\n    try {\n      const raw = localStorage.getItem(\"peru-trip-todo\");\n      if (raw) this.setState({ done: JSON.parse(raw) });\n    } catch (e) {}\n  }\n\n  persist(done) {\n    try { localStorage.setItem(\"peru-trip-todo\", JSON.stringify(done)); } catch (e) {}\n  }\n\n  setLens(v) { this.setState({ lens: v }); }\n\n  toggleTodo(id) {\n    this.setState(s => {\n      const done = Object.assign({}, s.done);\n      done[id] = !done[id];\n      this.persist(done);\n      return { done };\n    });\n  }\n\n  allDetails() {\n    const host = this.hostEl || document;\n    return Array.prototype.slice.call(host.querySelectorAll('[data-days=\"1\"] details'));\n  }\n\n  setAll(open) { this.allDetails().forEach(d => { d.open = open; }); }\n\n  sections() {\n    return {\n      lima_ceviche: [\n        [\"La Mar\", \"Miraflores\", \"Gast\\u00f3n Acurio's flagship cebicher\\u00eda. Lunch only, no reservations \\u2014 get the ceviche tasting.\", \"Av. Mariscal La Mar 770, Miraflores, Lima\", \"\", \"food\", 1],\n        [\"Isolina\", \"Barranco\", \"Nostalgic Lime\\u00f1o tavern, huge sharing plates: ceviche with fried octopus, arroz con pato. Reserve.\", \"Av. San Mart\\u00edn 101, Barranco, Lima\", \"\", \"food\", 1],\n        [\"Canta Rana\", \"Barranco\", \"Beloved, cash-only, 17 kinds of ceviche, football-and-clippings decor. Expect a line.\", \"G\\u00e9nova 101, Barranco, Lima\", \"\", \"food\", 0],\n        [\"Barra Maretazo\", \"Barranco\", \"Casual, beachy cevicher\\u00eda; shrimp risotto and very fresh fish.\", \"Av. Pedro de Osma 301, Barranco, Lima\", \"\", \"food\", 0]\n      ],\n      lima_street: [\n        [\"Grimanesa Vargas Anticuchos\", \"Miraflores\", \"Peru's most famous anticuchera; beef-heart skewers in panca-chile marinade. Evenings, cash, go early.\", \"Calle Ignacio Merino 466, Miraflores, Lima\", \"\", \"food\", 1],\n        [\"La Lucha Sanguicher\\u00eda\", \"Miraflores\", \"Modern sandwich classic; chicharr\\u00f3n sandwich + huayro fries + lucuma juice.\", \"Parque Kennedy, Miraflores, Lima\", \"\", \"food\", 0],\n        [\"El Chinito\", \"Historic Centre\", \"Historic chicharr\\u00f3n sandwich shop, repeatedly voted Lima's best. Cash only.\", \"\", \"\", \"food\", 0],\n        [\"Picarones Mary\", \"Miraflores\", \"Syrup-drenched squash/sweet-potato doughnuts from a Parque Kennedy cart. A must-try.\", \"\", \"\", \"food\", 0]\n      ],\n      lima_special: [\n        [\"Mayta\", \"Miraflores\", \"Jaime Pesaque's tasting menu; No. 39 on World's 50 Best 2025; coast, Andes & Amazon in 10 courses. Reserve.\", \"Av. Mariscal La Mar 1285, Miraflores, Lima\", \"\", \"food\", 0],\n        [\"Central / Kjolle\", \"Barranco\", \"If a slot opens: Virgilio Mart\\u00ednez's ecosystem tasting menu, often World's No. 1. Kjolle is its sister next door.\", \"Av. Pedro de Osma 301, Barranco, Lima\", \"\", \"food\", 0]\n      ],\n      lima_drink: [\n        [\"Lady Bee\", \"Barranco\", \"BOOKED the 16th. Peru's top bar, World's 50 Best. Produce-driven cocktails + small plates.\", \"Av. Pedro de Osma 205, Barranco, Lima\", \"+51 1 438 3775\", \"food\", 1],\n        [\"Carnaval\", \"San Isidro\", \"The other 50-Best bar; ask for the 'Gran Carnaval' flight; famous ice program. Reserve.\", \"Av. Pardo y Aliaga 662, San Isidro, Lima\", \"\", \"food\", 0],\n        [\"Tostadur\\u00eda Bisetti\", \"Barranco\", \"Pioneering roaster + coffee lab. Try the 'Brew Fruit' (cold coffee + pineapple).\", \"Av. Pedro de Osma 116, Barranco, Lima\", \"\", \"food\", 0],\n        [\"BarBarian\", \"Barranco / Miraflores\", \"Craft-beer taproom, 20+ Peruvian taps. Laid-back.\", \"Av. Pedro de Osma 144, Barranco, Lima\", \"\", \"food\", 0]\n      ],\n      lima_art: [\n        [\"Bajada de Ba\\u00f1os & Pasaje Oroya\", \"Barranco\", \"Mural epicentre; look for Jade Rivera & Yandy Graffer works near the Bridge of Sighs.\", \"\", \"\", \"art\", 1],\n        [\"D\\u00e9dalo\", \"Barranco\", \"30-year institution in a restored mansion: 700+ artists across themed rooms, courtyard caf\\u00e9.\", \"Jir\\u00f3n S\\u00e1enz Pe\\u00f1a 295, Barranco, Lima\", \"\", \"art\", 1],\n        [\"MATE \\u2013 Museo Mario Testino\", \"Barranco\", \"The Peruvian photographer's museum; sharp, stylish, compact.\", \"\", \"\", \"art\", 0],\n        [\"Museo Pedro de Osma\", \"Barranco\", \"Colonial art in a gorgeous mansion with stunning stained glass.\", \"Av. Pedro de Osma 421, Barranco, Lima\", \"\", \"art\", 0]\n      ],\n      lima_skate: [\n        [\"Faster Skateshop\", \"Miraflores\", \"Core shop since 2004 (Baker, Deathwish, Independent, Thrasher). In the Multicentro gallery basement.\", \"Av. Larco 345, Miraflores, Lima\", \"+51 1 241 0039\", \"skate\", 1],\n        [\"Freeway Skateshop\", \"Miraflores\", \"Specialists since 1995; decks plus scooters/blades. Mon\\u2013Sat 11\\u20138.\", \"Grimaldo del Solar 142, Miraflores, Lima\", \"\", \"skate\", 0],\n        [\"Skate Outlet\", \"Surco\", \"Oldest/most complete shop in Peru (since 1998); Baker, Plan B, Real, Antihero. VERIFY address before going. Listed: Av. Aviaci\\u00f3n 5096, Surco, Lima.\", \"\", \"\", \"skate\", 0],\n        [\"Dunkelvolk\", \"Lima\", \"Peruvian skate/surf apparel brand (est. 1996); good streetwear souvenir hunt.\", \"\", \"\", \"skate\", 0]\n      ],\n      lima_history: [\n        [\"Museo Larco\", \"Pueblo Libre\", \"One of the world's great museums; pre-Columbian gold, ceramics, the famous erotic gallery.\", \"Av. Sim\\u00f3n Bol\\u00edvar 1515, Pueblo Libre, Lima\", \"\", \"art\", 1],\n        [\"San Francisco Catacombs\", \"Historic Centre\", \"Underground ossuary beneath a Baroque monastery; used as a cemetery until 1810. Guided only.\", \"\", \"\", \"art\", 0],\n        [\"Casa Aliaga\", \"Historic Centre\", \"Viceregal mansion gifted by Pizarro, still owned by the same family 480+ years on. By tour.\", \"Jir\\u00f3n de la Uni\\u00f3n 224, Lima\", \"\", \"art\", 0],\n        [\"Magic Water Circuit\", \"Parque de la Reserva\", \"Choreographed illuminated fountains at night; kitschy, huge, genuinely fun.\", \"\", \"\", \"art\", 0]\n      ],\n      cusco_eat: [\n        [\"Pachapapa\", \"San Blas\", \"Open-air courtyard with a clay oven on Plazoleta San Blas; roast dishes, cuy for the brave.\", \"\", \"\", \"food\", 1],\n        [\"La Cusque\\u00f1\\u00edsima\", \"Magisterio\", \"Family picanter\\u00eda since 1986, ~20 min from centre; baked cuy, choclo con queso, sarzas.\", \"\", \"\", \"food\", 0],\n        [\"Cicciolina\", \"Centre\", \"Creative Andean-Mediterranean upstairs on Calle Triunfo; Cusco's enduring favourite. Reserve.\", \"Calle Triunfo 393, Cusco\", \"\", \"food\", 0],\n        [\"Green Point\", \"San Blas\", \"Cusco's best-known vegan spot; even for omnivores, a great-value tasting lunch.\", \"\", \"\", \"food\", 0]\n      ],\n      cusco_art: [\n        [\"San Blas artisan quarter\", \"Cusco\", \"Casa M\\u00e9rida ceramics, Mend\\u00edvil figures, the 7 Angelitos alley; the artist heart of Cusco.\", \"Plazoleta San Blas, Cusco\", \"\", \"art\", 1],\n        [\"Twelve-Angled Stone\", \"Hatun Rumiyoc\", \"Famous perfectly-fitted Inca stone in an old palace wall; a two-minute marvel.\", \"\", \"\", \"art\", 0],\n        [\"Qorikancha\", \"Av. El Sol\", \"The Inca Temple of the Sun beneath Santo Domingo church; small site museum attached.\", \"\", \"\", \"art\", 0],\n        [\"Skatepark La Florida\", \"Barrio La Florida\", \"Basic free concrete park; the spot to meet local skaters/fingerboarders. Community is social-media-run; ask around.\", \"\", \"\", \"skate\", 0]\n      ],\n      valley: [\n        [\"Mil\", \"near Moray\", \"Virgilio Mart\\u00ednez's high-altitude tasting menu beside the Moray terraces. A destination in itself \\u2014 book far ahead.\", \"\", \"\", \"food\", 1],\n        [\"Chuncho\", \"Ollantaytambo\", \"Andean techniques on Andean ingredients; roast lamb, cuy, chicha, simply plated.\", \"\", \"\", \"food\", 0],\n        [\"Moray\", \"Sacred Valley\", \"Concentric circular Inca terraces; an agricultural 'laboratory' of microclimates.\", \"\", \"\", \"art\", 0],\n        [\"Pisac Market & Ruins\", \"Pisac\", \"Hilltop ruins with a solar observatory, plus one of the valley's best craft markets.\", \"\", \"\", \"art\", 0]\n      ],\n      aguas: [\n        [\"Indio Feliz\", \"Aguas Calientes\", \"The town's most-loved spot; colourful French-Peruvian; a rewarding post-hike dinner.\", \"\", \"\", \"food\", 1],\n        [\"Caf\\u00e9 de Par\\u00eds\", \"Av. Pachacutec\", \"French-owned patisserie; best bread/pastries in town and box lunches for the mountain.\", \"\", \"\", \"food\", 0],\n        [\"Town Food Market\", \"main plaza\", \"Cheapest eats in town; set menus from ~8 soles. Try fresh Andean trout.\", \"\", \"\", \"food\", 0]\n      ],\n      puno: [\n        [\"Taquile Island\", \"Lake Titicaca\", \"UNESCO-listed for textiles woven by the men; peaceful, car-free, fresh-trout lunch.\", \"\", \"\", \"art\", 1],\n        [\"Sillustani\", \"Lake Umayo, ~35 km\", \"Pre-Inca Qolla funerary towers (chullpas) on a peninsula; magic at golden hour.\", \"\", \"\", \"art\", 0],\n        [\"Puno Cathedral\", \"Puno centre\", \"Andean-Baroque fa\\u00e7ade on the main plaza; a quick, striking stop.\", \"\", \"\", \"art\", 0],\n        [\"Yavar\\u00ed Steamship\", \"Puno lakefront\", \"A 160-year-old British-built iron steamship, now a floating museum. Delightfully odd.\", \"\", \"\", \"art\", 0]\n      ]\n    };\n  }\n\n  todoData() {\n    return [\n      [\"mil\", \"Book Mil (Sacred Valley) \\u2014 book far ahead\"],\n      [\"isolina\", \"Book Isolina (Barranco)\"],\n      [\"carnaval\", \"Book Carnaval (San Isidro)\"],\n      [\"central\", \"Chase any Central / Kjolle slot\"],\n      [\"wayna\", \"Confirm Wayna Picchu permit yourself \\u2014 Intrepid won't arrange it\"],\n      [\"altitude\", \"Ask a doctor about altitude meds\"],\n      [\"skateoutlet\", \"Verify Skate Outlet's Surco address before going\"],\n      [\"hours\", \"Reconfirm hours & bookings for the big names close to travel\"],\n      [\"transfer\", \"Arrange the Sept 26 airport transfer the night before\"]\n    ];\n  }\n\n  chip(active) {\n    return {\n      font: \"600 10px/1 'Work Sans',sans-serif\",\n      letterSpacing: \".1em\",\n      textTransform: \"uppercase\",\n      padding: \"7px 10px\",\n      borderRadius: \"999px\",\n      cursor: \"pointer\",\n      whiteSpace: \"nowrap\",\n      border: active ? \"1px solid #E4007C\" : \"1px solid rgba(255,251,245,.28)\",\n      background: active ? \"#E4007C\" : \"transparent\",\n      color: \"#FFFBF5\"\n    };\n  }\n\n  renderVals() {\n    const lens = this.state.lens || this.props.lens || \"all\";\n    const secs = this.sections();\n    const out = {};\n\n    Object.keys(secs).forEach(key => {\n      const items = secs[key]\n        .filter(r => lens === \"all\" || r[5] === lens)\n        .map(r => {\n          const addr = r[3];\n          const phone = r[4];\n          return {\n            name: r[0],\n            area: r[1],\n            note: r[2],\n            addr: addr || null,\n            map: addr ? \"https://www.google.com/maps/search/?api=1&query=\" + encodeURIComponent(r[0] + \" \" + addr) : null,\n            phone: phone || null,\n            tel: phone ? \"tel:\" + phone.replace(/[^+0-9]/g, \"\") : null,\n            star: !!r[6]\n          };\n        });\n      out[\"sec_\" + key] = items;\n      out[\"show_\" + key] = items.length > 0;\n    });\n\n    out.todos = this.todoData().map(t => {\n      const done = !!this.state.done[t[0]];\n      return {\n        label: t[1],\n        mark: done ? \"\\u2713\" : \"\",\n        toggle: () => this.toggleTodo(t[0]),\n        style: {\n          background: \"#FFFBF5\",\n          padding: \"13px 15px\",\n          display: \"flex\",\n          gap: \"11px\",\n          alignItems: \"flex-start\",\n          cursor: \"pointer\"\n        },\n        box: {\n          flex: \"0 0 auto\",\n          width: \"20px\",\n          height: \"20px\",\n          borderRadius: \"3px\",\n          display: \"grid\",\n          placeItems: \"center\",\n          font: \"700 12px/1 'Work Sans',sans-serif\",\n          border: done ? \"1px solid #E4007C\" : \"1px solid rgba(18,16,15,.35)\",\n          background: done ? \"#E4007C\" : \"transparent\",\n          color: \"#FFFBF5\"\n        },\n        text: {\n          fontSize: \"14.5px\",\n          lineHeight: \"1.4\",\n          textDecoration: done ? \"line-through\" : \"none\",\n          color: done ? \"rgba(18,16,15,.4)\" : \"#12100F\"\n        }\n      };\n    });\n\n    out.lensAll = () => this.setLens(\"all\");\n    out.lensFood = () => this.setLens(\"food\");\n    out.lensSkate = () => this.setLens(\"skate\");\n    out.chipAll = this.chip(lens === \"all\");\n    out.chipFood = this.chip(lens === \"food\");\n    out.chipSkate = this.chip(lens === \"skate\");\n    out.expandAll = () => this.setAll(true);\n    out.collapseAll = () => this.setAll(false);\n    out.showMaps = this.props.showMaps !== false;\n    out.mapHeight = this.props.mapHeight || 240;\n    out.bigMapH = (this.props.mapHeight || 240) + 90;\n    return out;\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
